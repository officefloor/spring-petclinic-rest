composition:
  authorize: "hasRole('VET_ADMIN')"

build:
  class: org.springframework.samples.petclinic.rest.function.pettype.BuildPetType
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.pettype.SavePetType
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.pettype.RespondWithPetTypeCreated
  govern: [ transaction ]
