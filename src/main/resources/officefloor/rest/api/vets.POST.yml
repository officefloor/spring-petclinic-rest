composition:
  authorize: "hasRole('VET_ADMIN')"

build:
  class: org.springframework.samples.petclinic.rest.function.vet.BuildVet
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.vet.SaveVet
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.vet.RespondWithVetCreated
  govern: [ transaction ]
