composition:
  authorize: "hasRole('VET_ADMIN')"

load:
  class: org.springframework.samples.petclinic.rest.function.pettype.LoadPetType
  govern: [ transaction ]
  next: delete

delete:
  class: org.springframework.samples.petclinic.rest.function.pettype.DeletePetType
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.common.RespondWithNoContent
  govern: [ transaction ]
