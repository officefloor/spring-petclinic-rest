composition:
  authorize: "hasRole('VET_ADMIN')"

validate:
  class: org.springframework.samples.petclinic.rest.function.pettype.ValidatePetType
  govern: [ transaction ]
  next: load

load:
  class: org.springframework.samples.petclinic.rest.function.pettype.LoadPetType
  govern: [ transaction ]
  next: apply

apply:
  class: org.springframework.samples.petclinic.rest.function.pettype.ApplyPetType
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.pettype.SavePetType
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.pettype.RespondWithPetTypeUpdated
  govern: [ transaction ]
