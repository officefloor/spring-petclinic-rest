composition:
  authorize: "hasAnyRole('OWNER_ADMIN', 'VET_ADMIN')"

load:
  class: org.springframework.samples.petclinic.rest.function.pettype.LoadPetType
  govern: [ readonly-transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.pettype.RespondWithPetType
  govern: [ readonly-transaction ]
