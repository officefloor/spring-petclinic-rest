composition:
  authorize: "hasRole('VET_ADMIN')"

build:
  class: org.springframework.samples.petclinic.rest.function.specialty.BuildSpecialty
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.specialty.SaveSpecialty
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.specialty.RespondWithSpecialtyCreated
  govern: [ transaction ]
