composition:
  authorize: "hasRole('OWNER_ADMIN')"

dailyLimit:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireDailyLimit
  next: require

require:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireOwnerFields
  next: normalize

normalize:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerTelephone
  next: email

email:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerEmail
  next: unique

unique:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireUniqueOwnerTelephone
  govern: [ transaction ]
  next: household

household:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireUniqueHousehold
  govern: [ transaction ]
  next: capacity

capacity:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireCityCapacity
  govern: [ transaction ]
  next: build

build:
  class: org.springframework.samples.petclinic.rest.function.owner.BuildOwner
  govern: [ transaction ]
  next: assignCode

assignCode:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignCustomerCode
  govern: [ transaction ]
  next: countNamesakes

countNamesakes:
  class: org.springframework.samples.petclinic.rest.function.owner.CountNamesakes
  govern: [ transaction ]
  next: countHousehold

countHousehold:
  class: org.springframework.samples.petclinic.rest.function.owner.CountHousehold
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerCreated
  govern: [ transaction ]
