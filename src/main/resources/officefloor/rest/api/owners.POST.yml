composition:
  authorize: "hasRole('OWNER_ADMIN')"

validate:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireOwnerFields
  govern: [ transaction ]
  next: unique

unique:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireUniqueTelephone
  govern: [ transaction ]
  next: household

household:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireUniqueHousehold
  govern: [ transaction ]
  next: capacity

capacity:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireCityCapacity
  govern: [ transaction ]
  next: dailyLimit

dailyLimit:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireDailyLimit
  govern: [ transaction ]
  next: build

build:
  class: org.springframework.samples.petclinic.rest.function.owner.BuildOwner
  govern: [ transaction ]
  next: assignCode

assignCode:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignCustomerCode
  govern: [ transaction ]
  next: assignHousehold

assignHousehold:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignHousehold
  govern: [ transaction ]
  next: assignNamesakeCount

assignNamesakeCount:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignNamesakeCount
  govern: [ transaction ]
  next: assignBulkSignupWarning

assignBulkSignupWarning:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignBulkSignupWarning
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: audit

audit:
  class: org.springframework.samples.petclinic.rest.function.owner.AuditOwnerCreated
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerCreated
  govern: [ transaction ]
