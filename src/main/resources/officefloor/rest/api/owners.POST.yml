composition:
  authorize: "hasRole('OWNER_ADMIN')"

build:
  class: org.springframework.samples.petclinic.rest.function.owner.BuildOwner
  govern: [ transaction ]
  next: ensureUnique

ensureUnique:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureOwnerUnique
  govern: [ transaction ]
  next: enforceDailyLimit

enforceDailyLimit:
  class: org.springframework.samples.petclinic.rest.function.owner.EnforceDailyOwnerLimit
  govern: [ transaction ]
  next: enforceCityLimit

enforceCityLimit:
  class: org.springframework.samples.petclinic.rest.function.owner.EnforceCityOwnerLimit
  govern: [ transaction ]
  next: countNamesakes

countNamesakes:
  class: org.springframework.samples.petclinic.rest.function.owner.CountNamesakes
  govern: [ transaction ]
  next: assignMembership

assignMembership:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignMembershipNumber
  govern: [ transaction ]
  next: assignMembershipTier

assignMembershipTier:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignMembershipTier
  govern: [ transaction ]
  next: normalizeCity

normalizeCity:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeCity
  govern: [ transaction ]
  next: assignCustomerCode

assignCustomerCode:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignCustomerCode
  govern: [ transaction ]
  next: computeSharesHousehold

computeSharesHousehold:
  class: org.springframework.samples.petclinic.rest.function.owner.ComputeSharesHousehold
  govern: [ transaction ]
  next: computeLocality

computeLocality:
  class: org.springframework.samples.petclinic.rest.function.owner.ComputeLocality
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: audit

audit:
  class: org.springframework.samples.petclinic.rest.function.owner.AuditOwnerCreated
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerCreated
  govern: [ transaction ]
