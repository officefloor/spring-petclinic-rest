composition:
  authorize: "hasRole('OWNER_ADMIN')"

checkIdempotency:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckIdempotencyKey
  govern: [ transaction ]
  outputs:
    create: normalizeAddress

normalizeAddress:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerAddress
  govern: [ transaction ]
  next: require

require:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireOwnerFields
  govern: [ transaction ]
  next: requirePostcode

requirePostcode:
  class: org.springframework.samples.petclinic.rest.function.owner.RequirePostcodeInRegion
  govern: [ transaction ]
  next: normalizeTelephone

normalizeTelephone:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerTelephone
  govern: [ transaction ]
  next: requireTelephoneLength

requireTelephoneLength:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireTelephoneNationalLength
  govern: [ transaction ]
  next: normalizeEmail

normalizeEmail:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerEmail
  govern: [ transaction ]
  next: requireEmailAllowed

requireEmailAllowed:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireOwnerEmailAllowed
  govern: [ transaction ]
  next: requireUniqueIdentity

requireUniqueIdentity:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireUniqueIdentity
  govern: [ transaction ]
  next: requireCityCapacity

requireCityCapacity:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireCityCapacity
  govern: [ transaction ]
  next: build

build:
  class: org.springframework.samples.petclinic.rest.function.owner.BuildOwner
  govern: [ transaction ]
  next: flagCityCapacityWarning

flagCityCapacityWarning:
  class: org.springframework.samples.petclinic.rest.function.owner.FlagOwnerCityCapacityWarning
  govern: [ transaction ]
  next: assignHousehold

assignHousehold:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerHousehold
  govern: [ transaction ]
  next: assignHouseholdSize

assignHouseholdSize:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerHouseholdSize
  govern: [ transaction ]
  next: requireRegistrationDateNotFuture

requireRegistrationDateNotFuture:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireRegistrationDateNotFuture
  govern: [ transaction ]
  next: resolveRegistrationDate

resolveRegistrationDate:
  class: org.springframework.samples.petclinic.rest.function.owner.ResolveOwnerRegistrationDate
  govern: [ transaction ]
  next: requireDailyCapacity

requireDailyCapacity:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireDailyRegistrationCapacity
  govern: [ transaction ]
  next: flagBulkSignup

flagBulkSignup:
  class: org.springframework.samples.petclinic.rest.function.owner.FlagOwnerBulkSignup
  govern: [ transaction ]
  next: assignMemberId

assignMemberId:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerMemberId
  govern: [ transaction ]
  next: assignNamesakeCount

assignNamesakeCount:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerNamesakeCount
  govern: [ transaction ]
  next: assignMembershipLevel

assignMembershipLevel:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerMembershipLevel
  govern: [ transaction ]
  next: flagPossibleDuplicate

flagPossibleDuplicate:
  class: org.springframework.samples.petclinic.rest.function.owner.FlagOwnerPossibleDuplicate
  govern: [ transaction ]
  next: assignIdempotencyKey

assignIdempotencyKey:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerIdempotencyKey
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: audit

audit:
  class: org.springframework.samples.petclinic.rest.function.owner.AuditOwnerCreated
  govern: [ transaction ]
  next: emitEvent

emitEvent:
  class: org.springframework.samples.petclinic.rest.function.owner.EmitOwnerCreatedEvent
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerCreated
  govern: [ transaction ]
