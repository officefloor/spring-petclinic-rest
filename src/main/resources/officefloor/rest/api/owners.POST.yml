composition:
  authorize: "hasRole('OWNER_ADMIN')"

idempotency:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckIdempotencyKey
  govern: [ transaction ]
  outputs:
    create: validate

validate:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateOwner
  next: checkIdentity

checkIdentity:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckIdentityUnique
  govern: [ transaction ]
  next: checkCityCapacity

checkCityCapacity:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckCityCapacity
  govern: [ transaction ]
  next: resolveRegistrationDate

resolveRegistrationDate:
  class: org.springframework.samples.petclinic.rest.function.owner.ResolveRegistrationDate
  next: checkDailyLimit

checkDailyLimit:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckDailyLimit
  govern: [ transaction ]
  next: build

build:
  class: org.springframework.samples.petclinic.rest.function.owner.BuildOwner
  govern: [ transaction ]
  next: assignHousehold

assignHousehold:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignHousehold
  govern: [ transaction ]
  next: assignMemberId

assignMemberId:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignMemberId
  govern: [ transaction ]
  next: assignNamesakeCount

assignNamesakeCount:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignNamesakeCount
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: audit

audit:
  class: org.springframework.samples.petclinic.rest.function.owner.AuditOwnerCreated
  govern: [ transaction ]
  next: emitEvent

emitEvent:
  class: org.springframework.samples.petclinic.rest.function.owner.EmitOwnerCreatedEvent
  govern: [ transaction ]
  next: notifyWelcome

notifyWelcome:
  class: org.springframework.samples.petclinic.rest.function.owner.EnqueueWelcomeNotification
  govern: [ transaction ]
  next: record

record:
  class: org.springframework.samples.petclinic.rest.function.owner.RecordIdempotencyKey
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerCreated
  govern: [ transaction ]
