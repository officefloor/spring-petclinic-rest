composition:
  authorize: "hasRole('OWNER_ADMIN')"

# An 'Idempotency-Key' already seen returns the original owner (200) via 'existing';
# otherwise 'proceed' runs the normal create pipeline. First so a repeat short-circuits
# before body validation and before the duplicate-household check (which would be 409).
idempotency:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckOwnerIdempotency
  govern: [ transaction ]
  outputs:
    existing: respondExisting
    proceed: normalizeAddress

respondExisting:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwner
  govern: [ transaction ]

normalizeAddress:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerAddress
  govern: [ transaction ]
  next: validate

validate:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateRequiredOwnerFields
  govern: [ transaction ]
  next: validatePostcode

validatePostcode:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateOwnerPostcode
  govern: [ transaction ]
  next: rejectFutureRegistrationDate

rejectFutureRegistrationDate:
  class: org.springframework.samples.petclinic.rest.function.owner.RejectFutureRegistrationDate
  govern: [ transaction ]
  next: resolveRegistrationDate

resolveRegistrationDate:
  class: org.springframework.samples.petclinic.rest.function.owner.ResolveOwnerRegistrationDate
  govern: [ transaction ]
  next: rejectDailyLimit

rejectDailyLimit:
  class: org.springframework.samples.petclinic.rest.function.owner.RejectDailyOwnerLimit
  govern: [ transaction ]
  next: rejectFullCity

rejectFullCity:
  class: org.springframework.samples.petclinic.rest.function.owner.RejectFullOwnerCity
  govern: [ transaction ]
  next: normalizeTelephone

normalizeTelephone:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerTelephone
  govern: [ transaction ]
  next: normalizeEmail

normalizeEmail:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerEmail
  govern: [ transaction ]
  next: rejectDisposableEmail

rejectDisposableEmail:
  class: org.springframework.samples.petclinic.rest.function.owner.RejectDisposableOwnerEmail
  govern: [ transaction ]
  next: rejectDuplicateHousehold

rejectDuplicateHousehold:
  class: org.springframework.samples.petclinic.rest.function.owner.RejectDuplicateOwnerHousehold
  govern: [ transaction ]
  next: build

build:
  class: org.springframework.samples.petclinic.rest.function.owner.BuildOwner
  govern: [ transaction ]
  next: assignNamesakeCount

assignNamesakeCount:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerNamesakeCount
  govern: [ transaction ]
  next: applyRegistrationDate

applyRegistrationDate:
  class: org.springframework.samples.petclinic.rest.function.owner.ApplyOwnerRegistrationDate
  govern: [ transaction ]
  next: assignCustomerCode

assignCustomerCode:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerCustomerCode
  govern: [ transaction ]
  next: assignHousehold

assignHousehold:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerHousehold
  govern: [ transaction ]
  next: assignHouseholdSize

assignHouseholdSize:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerHouseholdSize
  govern: [ transaction ]
  next: assignBulkSignupWarning

assignBulkSignupWarning:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerBulkSignupWarning
  govern: [ transaction ]
  next: assignPossibleDuplicate

assignPossibleDuplicate:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerPossibleDuplicate
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: audit

audit:
  class: org.springframework.samples.petclinic.rest.function.owner.AuditOwnerCreated
  govern: [ transaction ]
  next: record

record:
  class: org.springframework.samples.petclinic.rest.function.owner.RecordOwnerIdempotency
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerCreated
  govern: [ transaction ]
