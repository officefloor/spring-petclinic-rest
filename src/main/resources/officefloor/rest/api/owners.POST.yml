composition:
  authorize: "hasRole('OWNER_ADMIN')"

build:
  class: org.springframework.samples.petclinic.rest.function.owner.BuildOwner
  govern: [ transaction ]
  next: normalizeCity

normalizeCity:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeCity
  govern: [ transaction ]
  next: rejectCityLimit

rejectCityLimit:
  class: org.springframework.samples.petclinic.rest.function.owner.RejectOwnerCityLimit
  govern: [ transaction ]
  next: rejectDailyLimit

rejectDailyLimit:
  class: org.springframework.samples.petclinic.rest.function.owner.RejectDailyOwnerLimit
  govern: [ transaction ]
  next: rejectDuplicate

rejectDuplicate:
  class: org.springframework.samples.petclinic.rest.function.owner.RejectDuplicateOwner
  govern: [ transaction ]
  next: rejectDuplicateEmail

rejectDuplicateEmail:
  class: org.springframework.samples.petclinic.rest.function.owner.RejectDuplicateOwnerEmail
  govern: [ transaction ]
  next: assignMembership

assignMembership:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignMembershipNumber
  govern: [ transaction ]
  next: assignCustomerCode

assignCustomerCode:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignCustomerCode
  govern: [ transaction ]
  next: assignMembershipTier

assignMembershipTier:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignMembershipTier
  govern: [ transaction ]
  next: assignNamesakeCount

assignNamesakeCount:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignNamesakeCount
  govern: [ transaction ]
  next: assignSharesHousehold

assignSharesHousehold:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignSharesHousehold
  govern: [ transaction ]
  next: assignLocality

assignLocality:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignLocality
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: audit

audit:
  class: org.springframework.samples.petclinic.rest.function.owner.AuditOwnerCreation
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerCreated
  govern: [ transaction ]
