composition:
  authorize: "hasRole('OWNER_ADMIN')"

checkIdempotency:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckIdempotencyKey
  govern: [ transaction ]
  next: validate

validate:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateOwnerFields
  govern: [ transaction ]
  next: checkFutureDate

checkFutureDate:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckRegistrationDateNotFuture
  govern: [ transaction ]
  next: validatePostcode

validatePostcode:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidatePostcode
  govern: [ transaction ]
  next: normalize

normalize:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerTelephone
  govern: [ transaction ]
  next: normalizeEmail

normalizeEmail:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerEmail
  govern: [ transaction ]
  next: checkEmailDomain

checkEmailDomain:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckEmailDomainAllowed
  govern: [ transaction ]
  next: normalizeAddress

normalizeAddress:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerAddress
  govern: [ transaction ]
  next: checkCityCapacity

checkCityCapacity:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckOwnerCityCapacity
  govern: [ transaction ]
  next: checkDailyLimit

checkDailyLimit:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckOwnerDailyLimit
  govern: [ transaction ]
  next: build

build:
  class: org.springframework.samples.petclinic.rest.function.owner.BuildOwner
  govern: [ transaction ]
  next: countNamesakes

countNamesakes:
  class: org.springframework.samples.petclinic.rest.function.owner.CountNamesakes
  govern: [ transaction ]
  next: assignMemberId

assignMemberId:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignMemberId
  govern: [ transaction ]
  next: assignHousehold

assignHousehold:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignHousehold
  govern: [ transaction ]
  next: checkIdentity

checkIdentity:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckOwnerIdentityUnique
  govern: [ transaction ]
  next: checkPossibleDuplicate

checkPossibleDuplicate:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckPossibleDuplicate
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: audit

audit:
  class: org.springframework.samples.petclinic.rest.function.owner.AuditOwnerCreated
  govern: [ transaction ]
  next: enqueueWelcome

enqueueWelcome:
  class: org.springframework.samples.petclinic.rest.function.owner.EnqueueWelcomeNotification
  govern: [ transaction ]
  next: emitEvent

emitEvent:
  class: org.springframework.samples.petclinic.rest.function.owner.EmitOwnerCreatedEvent
  govern: [ transaction ]
  next: bulkWarning

bulkWarning:
  class: org.springframework.samples.petclinic.rest.function.owner.MarkBulkSignupWarning
  govern: [ transaction ]
  next: capacityWarning

capacityWarning:
  class: org.springframework.samples.petclinic.rest.function.owner.MarkCityCapacityWarning
  govern: [ transaction ]
  next: countHousehold

countHousehold:
  class: org.springframework.samples.petclinic.rest.function.owner.CountHouseholdMembers
  govern: [ transaction ]
  next: capMembership

capMembership:
  class: org.springframework.samples.petclinic.rest.function.owner.CapMembershipLevel
  govern: [ transaction ]
  next: recordIdempotency

recordIdempotency:
  class: org.springframework.samples.petclinic.rest.function.owner.RecordIdempotencyKey
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerCreated
  govern: [ transaction ]
