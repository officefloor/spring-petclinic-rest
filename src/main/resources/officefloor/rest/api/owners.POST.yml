composition:
  authorize: "hasRole('OWNER_ADMIN')"

check:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckIdempotency
  govern: [ transaction ]
  outputs:
    create: require

require:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireOwnerFields
  next: registrationDate

registrationDate:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireRegistrationDateNotFuture
  next: postcode

postcode:
  class: org.springframework.samples.petclinic.rest.function.owner.RequirePostcode
  next: uniqueIdentity

uniqueIdentity:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireUniqueIdentity
  govern: [ transaction ]
  next: cityCapacity

cityCapacity:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireCityCapacity
  govern: [ transaction ]
  next: dailyLimit

dailyLimit:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireDailyRegistrationLimit
  govern: [ transaction ]
  next: build

build:
  class: org.springframework.samples.petclinic.rest.function.owner.BuildOwner
  govern: [ transaction ]
  next: possibleDuplicate

possibleDuplicate:
  class: org.springframework.samples.petclinic.rest.function.owner.FlagPossibleDuplicate
  govern: [ transaction ]
  next: memberId

memberId:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignMemberId
  govern: [ transaction ]
  next: namesakes

namesakes:
  class: org.springframework.samples.petclinic.rest.function.owner.CountNamesakes
  govern: [ transaction ]
  next: householdSize

householdSize:
  class: org.springframework.samples.petclinic.rest.function.owner.CountHouseholdMembers
  govern: [ transaction ]
  next: membershipLevelCap

membershipLevelCap:
  class: org.springframework.samples.petclinic.rest.function.owner.CapMembershipLevel
  govern: [ transaction ]
  next: bulkSignup

bulkSignup:
  class: org.springframework.samples.petclinic.rest.function.owner.FlagBulkSignupWarning
  govern: [ transaction ]
  next: capacityWarning

capacityWarning:
  class: org.springframework.samples.petclinic.rest.function.owner.FlagCapacityWarning
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: recordIdempotency

recordIdempotency:
  class: org.springframework.samples.petclinic.rest.function.owner.RecordIdempotency
  govern: [ transaction ]
  next: audit

audit:
  class: org.springframework.samples.petclinic.rest.function.owner.AuditOwnerCreated
  govern: [ transaction ]
  next: welcome

welcome:
  class: org.springframework.samples.petclinic.rest.function.owner.EnqueueWelcomeNotification
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerCreated
  govern: [ transaction ]
