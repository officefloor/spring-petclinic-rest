composition:
  authorize: "hasRole('OWNER_ADMIN')"

checkIdempotency:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckIdempotencyKey
  govern: [ transaction ]
  outputs:
    replay: respondExisting
    proceed: validate

respondExisting:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwner
  govern: [ transaction ]

validate:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateNewOwner
  govern: [ transaction ]
  next: validateRegistrationDate

validateRegistrationDate:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateRegistrationDate
  govern: [ transaction ]
  next: validatePostcode

validatePostcode:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateOwnerPostcode
  govern: [ transaction ]
  next: normalizeAddress

normalizeAddress:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerAddress
  govern: [ transaction ]
  next: normalizeTelephone

normalizeTelephone:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerTelephone
  govern: [ transaction ]
  next: normalizeEmail

normalizeEmail:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerEmail
  govern: [ transaction ]
  next: validateEmailDomain

validateEmailDomain:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateEmailDomain
  govern: [ transaction ]
  next: ensureUniqueIdentity

ensureUniqueIdentity:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureUniqueIdentity
  govern: [ transaction ]
  next: ensureUniqueHousehold

ensureUniqueHousehold:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureUniqueHousehold
  govern: [ transaction ]
  next: ensureCityHasCapacity

ensureCityHasCapacity:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureCityHasCapacity
  govern: [ transaction ]
  next: ensureDailyLimit

ensureDailyLimit:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureDailyLimit
  govern: [ transaction ]
  next: build

build:
  class: org.springframework.samples.petclinic.rest.function.owner.BuildOwner
  govern: [ transaction ]
  next: resolveRegistrationDate

resolveRegistrationDate:
  class: org.springframework.samples.petclinic.rest.function.owner.ResolveRegistrationDate
  govern: [ transaction ]
  next: assignCustomerCode

assignCustomerCode:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignCustomerCode
  govern: [ transaction ]
  next: assignHousehold

assignHousehold:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignHouseholdId
  govern: [ transaction ]
  next: assignIdentityKey

assignIdentityKey:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignIdentityKey
  govern: [ transaction ]
  next: countNamesakes

countNamesakes:
  class: org.springframework.samples.petclinic.rest.function.owner.CountNamesakes
  govern: [ transaction ]
  next: countHousehold

countHousehold:
  class: org.springframework.samples.petclinic.rest.function.owner.CountHouseholdMembers
  govern: [ transaction ]
  next: flagBulkSignup

flagBulkSignup:
  class: org.springframework.samples.petclinic.rest.function.owner.FlagBulkSignup
  govern: [ transaction ]
  next: flagPossibleDuplicate

flagPossibleDuplicate:
  class: org.springframework.samples.petclinic.rest.function.owner.FlagPossibleDuplicate
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: recordIdempotency

recordIdempotency:
  class: org.springframework.samples.petclinic.rest.function.owner.RecordIdempotencyKey
  govern: [ transaction ]
  next: audit

audit:
  class: org.springframework.samples.petclinic.rest.function.owner.AuditOwnerCreated
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerCreated
  govern: [ transaction ]
