composition:
  authorize: "hasRole('OWNER_ADMIN')"

require:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireOwnerFields
  next: uniqueIdentity

uniqueIdentity:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireUniqueIdentity
  govern: [ transaction ]
  next: cityCapacity

cityCapacity:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireCityCapacity
  govern: [ transaction ]
  next: dailyLimit

dailyLimit:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireDailyRegistrationLimit
  govern: [ transaction ]
  next: build

build:
  class: org.springframework.samples.petclinic.rest.function.owner.BuildOwner
  govern: [ transaction ]
  next: customerCode

customerCode:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignCustomerCode
  govern: [ transaction ]
  next: namesakes

namesakes:
  class: org.springframework.samples.petclinic.rest.function.owner.CountNamesakes
  govern: [ transaction ]
  next: householdSize

householdSize:
  class: org.springframework.samples.petclinic.rest.function.owner.CountHouseholdMembers
  govern: [ transaction ]
  next: bulkSignup

bulkSignup:
  class: org.springframework.samples.petclinic.rest.function.owner.FlagBulkSignupWarning
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: audit

audit:
  class: org.springframework.samples.petclinic.rest.function.owner.AuditOwnerCreated
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerCreated
  govern: [ transaction ]
