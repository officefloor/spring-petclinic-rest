composition:
  authorize: "hasRole('OWNER_ADMIN')"

build:
  class: org.springframework.samples.petclinic.rest.function.owner.BuildOwner
  govern: [ transaction ]
  next: checkDailyLimit

checkDailyLimit:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckDailyRegistrationLimit
  govern: [ transaction ]
  next: checkDuplicate

checkDuplicate:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckDuplicateOwner
  govern: [ transaction ]
  next: checkDuplicateEmail

checkDuplicateEmail:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckDuplicateOwnerEmail
  govern: [ transaction ]
  next: checkCityCapacity

checkCityCapacity:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckCityCapacity
  govern: [ transaction ]
  next: assignMembershipNumber

assignMembershipNumber:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignMembershipNumber
  govern: [ transaction ]
  next: assignMembershipTier

assignMembershipTier:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignMembershipTier
  govern: [ transaction ]
  next: normaliseCity

normaliseCity:
  class: org.springframework.samples.petclinic.rest.function.owner.NormaliseCity
  govern: [ transaction ]
  next: assignCustomerCode

assignCustomerCode:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignCustomerCode
  govern: [ transaction ]
  next: assignNamesakeCount

assignNamesakeCount:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignNamesakeCount
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerCreated
  govern: [ transaction ]
