composition:
  authorize: "hasRole('OWNER_ADMIN')"

require:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireOwnerFields
  next: normalize

normalize:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerTelephone
  next: normalizeEmail

normalizeEmail:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerEmail
  next: rejectDisposableEmail

rejectDisposableEmail:
  class: org.springframework.samples.petclinic.rest.function.owner.RejectDisposableEmailDomain
  next: normalizeAddress

normalizeAddress:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerAddress
  next: rejectDuplicate

rejectDuplicate:
  class: org.springframework.samples.petclinic.rest.function.owner.RejectDuplicateOwnerIdentity
  next: rejectCrowdedCity

rejectCrowdedCity:
  class: org.springframework.samples.petclinic.rest.function.owner.RejectCrowdedCity
  next: rejectDailyLimit

rejectDailyLimit:
  class: org.springframework.samples.petclinic.rest.function.owner.RejectDailyLimit
  next: rejectInvalidPostcode

rejectInvalidPostcode:
  class: org.springframework.samples.petclinic.rest.function.owner.RejectInvalidPostcode
  next: rejectFutureDate

rejectFutureDate:
  class: org.springframework.samples.petclinic.rest.function.owner.RejectFutureRegistrationDate
  next: build

build:
  class: org.springframework.samples.petclinic.rest.function.owner.BuildOwner
  govern: [ transaction ]
  next: assignCustomerCode

assignCustomerCode:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignCustomerCode
  govern: [ transaction ]
  next: countNamesakes

countNamesakes:
  class: org.springframework.samples.petclinic.rest.function.owner.CountNamesakes
  govern: [ transaction ]
  next: detectPossibleDuplicate

detectPossibleDuplicate:
  class: org.springframework.samples.petclinic.rest.function.owner.DetectPossibleDuplicate
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerCreated
  govern: [ transaction ]
