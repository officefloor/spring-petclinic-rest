composition:
  authorize: "hasRole('OWNER_ADMIN')"

build:
  class: org.springframework.samples.petclinic.rest.function.owner.BuildOwner
  govern: [ transaction ]
  next: ensureUniqueIdentity

ensureUniqueIdentity:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureOwnerIdentityUnique
  govern: [ transaction ]
  next: ensureCityCapacity

ensureCityCapacity:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureOwnerCityWithinCapacity
  govern: [ transaction ]
  next: ensureDailyLimit

ensureDailyLimit:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureDailyOwnerLimitNotExceeded
  govern: [ transaction ]
  next: assignCustomerCode

assignCustomerCode:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerCustomerCode
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerCreated
  govern: [ transaction ]
