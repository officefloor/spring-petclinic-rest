composition:
  authorize: "hasRole('OWNER_ADMIN')"

checkIdempotency:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckIdempotency
  outputs:
    existing: respondExisting
    proceed: normalizeAddress

respondExisting:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithExistingOwner

normalizeAddress:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeAddress
  next: validate

validate:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateOwnerFields
  next: validateRegistrationDate

validateRegistrationDate:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateRegistrationDate
  next: validatePostcode

validatePostcode:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidatePostcode
  next: normalizeTelephone

normalizeTelephone:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeTelephone
  next: validateTelephoneLength

validateTelephoneLength:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateTelephoneLength
  next: ensureCityCapacity

ensureCityCapacity:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureCityCapacity
  next: normalizeEmail

normalizeEmail:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeEmail
  next: validateEmailDomain

validateEmailDomain:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateEmailDomain
  next: build

build:
  class: org.springframework.samples.petclinic.rest.function.owner.BuildOwner
  govern: [ transaction ]
  next: resolveRegistrationDate

resolveRegistrationDate:
  class: org.springframework.samples.petclinic.rest.function.owner.ResolveRegistrationDate
  govern: [ transaction ]
  next: ensureDailyOwnerLimit

ensureDailyOwnerLimit:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureDailyOwnerLimit
  govern: [ transaction ]
  next: flagBulkSignup

flagBulkSignup:
  class: org.springframework.samples.petclinic.rest.function.owner.FlagBulkSignup
  govern: [ transaction ]
  next: flagCapacityWarning

flagCapacityWarning:
  class: org.springframework.samples.petclinic.rest.function.owner.FlagCapacityWarning
  govern: [ transaction ]
  next: assignMemberId

assignMemberId:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignMemberId
  govern: [ transaction ]
  next: deduplicateMemberId

deduplicateMemberId:
  class: org.springframework.samples.petclinic.rest.function.owner.DeduplicateMemberId
  govern: [ transaction ]
  next: assignHousehold

assignHousehold:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignHousehold
  govern: [ transaction ]
  next: ensureUniqueIdentity

ensureUniqueIdentity:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureUniqueIdentity
  govern: [ transaction ]
  next: countHousehold

countHousehold:
  class: org.springframework.samples.petclinic.rest.function.owner.CountHousehold
  govern: [ transaction ]
  next: capMembershipLevel

capMembershipLevel:
  class: org.springframework.samples.petclinic.rest.function.owner.CapMembershipLevel
  govern: [ transaction ]
  next: countNamesakes

countNamesakes:
  class: org.springframework.samples.petclinic.rest.function.owner.CountNamesakes
  govern: [ transaction ]
  next: flagPossibleDuplicate

flagPossibleDuplicate:
  class: org.springframework.samples.petclinic.rest.function.owner.FlagPossibleDuplicate
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: recordIdempotency

recordIdempotency:
  class: org.springframework.samples.petclinic.rest.function.owner.RecordIdempotencyKey
  govern: [ transaction ]
  next: audit

audit:
  class: org.springframework.samples.petclinic.rest.function.owner.AuditOwnerCreated
  govern: [ transaction ]
  next: auditEvent

auditEvent:
  class: org.springframework.samples.petclinic.rest.function.owner.AuditOwnerCreatedEvent
  govern: [ transaction ]
  next: enqueueWelcome

enqueueWelcome:
  class: org.springframework.samples.petclinic.rest.function.owner.EnqueueWelcomeNotification
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerCreated
  govern: [ transaction ]
