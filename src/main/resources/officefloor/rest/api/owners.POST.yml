composition:
  authorize: "hasRole('OWNER_ADMIN')"

normalizeAddress:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeAddress
  govern: [ transaction ]
  next: require

require:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireOwnerFields
  govern: [ transaction ]
  next: rejectFutureDate

rejectFutureDate:
  class: org.springframework.samples.petclinic.rest.function.owner.RejectFutureRegistrationDate
  govern: [ transaction ]
  next: validatePostcode

validatePostcode:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidatePostcode
  govern: [ transaction ]
  next: normalize

normalize:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeTelephone
  govern: [ transaction ]
  next: normalizeEmail

normalizeEmail:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeEmail
  govern: [ transaction ]
  next: rejectDuplicate

rejectDuplicate:
  class: org.springframework.samples.petclinic.rest.function.owner.RejectDuplicateOwner
  govern: [ transaction ]
  next: rejectCityAtCapacity

rejectCityAtCapacity:
  class: org.springframework.samples.petclinic.rest.function.owner.RejectCityAtCapacity
  govern: [ transaction ]
  next: rejectOverDailyLimit

rejectOverDailyLimit:
  class: org.springframework.samples.petclinic.rest.function.owner.RejectOverDailyLimit
  govern: [ transaction ]
  next: build

build:
  class: org.springframework.samples.petclinic.rest.function.owner.BuildOwner
  govern: [ transaction ]
  next: assignCustomerCode

assignCustomerCode:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignCustomerCode
  govern: [ transaction ]
  next: assignMembershipNumber

assignMembershipNumber:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignMembershipNumber
  govern: [ transaction ]
  next: countNamesakes

countNamesakes:
  class: org.springframework.samples.petclinic.rest.function.owner.CountNamesakes
  govern: [ transaction ]
  next: assignMembershipLevel

assignMembershipLevel:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignMembershipLevel
  govern: [ transaction ]
  next: countHousehold

countHousehold:
  class: org.springframework.samples.petclinic.rest.function.owner.CountHousehold
  govern: [ transaction ]
  next: flagBulkSignup

flagBulkSignup:
  class: org.springframework.samples.petclinic.rest.function.owner.FlagBulkSignup
  govern: [ transaction ]
  next: detectPossibleDuplicate

detectPossibleDuplicate:
  class: org.springframework.samples.petclinic.rest.function.owner.DetectPossibleDuplicate
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: audit

audit:
  class: org.springframework.samples.petclinic.rest.function.owner.AuditOwnerCreated
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerCreated
  govern: [ transaction ]
