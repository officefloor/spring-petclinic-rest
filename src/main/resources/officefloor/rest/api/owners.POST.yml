composition:
  authorize: "hasRole('OWNER_ADMIN')"

build:
  class: org.springframework.samples.petclinic.rest.function.owner.BuildOwner
  govern: [ transaction ]
  next: adjustRegistrationDate

adjustRegistrationDate:
  class: org.springframework.samples.petclinic.rest.function.owner.AdjustOwnerRegistrationDate
  govern: [ transaction ]
  next: normalizeTelephone

normalizeTelephone:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerTelephone
  govern: [ transaction ]
  next: normalizeAddress

normalizeAddress:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerAddress
  govern: [ transaction ]
  next: ensureUniqueTelephone

ensureUniqueTelephone:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureUniqueOwnerTelephone
  govern: [ transaction ]
  next: ensureUniqueHousehold

ensureUniqueHousehold:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureUniqueOwnerHousehold
  govern: [ transaction ]
  next: ensureCityCapacity

ensureCityCapacity:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureCityHasCapacity
  govern: [ transaction ]
  next: ensureDailyCapacity

ensureDailyCapacity:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureDailyRegistrationCapacity
  govern: [ transaction ]
  next: assignCustomerCode

assignCustomerCode:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerCustomerCode
  govern: [ transaction ]
  next: countNamesakes

countNamesakes:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerNamesakeCount
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerCreated
  govern: [ transaction ]
