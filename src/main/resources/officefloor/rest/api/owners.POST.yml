composition:
  authorize: "hasRole('OWNER_ADMIN')"

recall:
  class: org.springframework.samples.petclinic.rest.function.owner.RecallIdempotentOwner
  govern: [ transaction ]
  next: validate

validate:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateOwnerFields
  govern: [ transaction ]
  next: ensureRegistrationDate

ensureRegistrationDate:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureRegistrationDateNotFuture
  govern: [ transaction ]
  next: ensurePostcode

ensurePostcode:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureValidPostcode
  govern: [ transaction ]
  next: normalize

normalize:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerTelephone
  govern: [ transaction ]
  next: normalizeEmail

normalizeEmail:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerEmail
  govern: [ transaction ]
  next: ensureEmailNotDisposable

ensureEmailNotDisposable:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureEmailNotDisposable
  govern: [ transaction ]
  next: normalizeAddress

normalizeAddress:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerAddress
  govern: [ transaction ]
  next: ensureCityCapacity

ensureCityCapacity:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureCityHasCapacity
  govern: [ transaction ]
  next: ensureDailyLimit

ensureDailyLimit:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureDailyOwnerLimit
  govern: [ transaction ]
  next: build

build:
  class: org.springframework.samples.petclinic.rest.function.owner.BuildOwner
  govern: [ transaction ]
  next: assignHousehold

assignHousehold:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignHousehold
  govern: [ transaction ]
  next: ensureUniqueIdentity

ensureUniqueIdentity:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureUniqueIdentity
  govern: [ transaction ]
  next: flagPossibleDuplicate

flagPossibleDuplicate:
  class: org.springframework.samples.petclinic.rest.function.owner.FlagPossibleDuplicate
  govern: [ transaction ]
  next: resolveRegistrationDate

resolveRegistrationDate:
  class: org.springframework.samples.petclinic.rest.function.owner.ResolveOwnerRegistrationDate
  govern: [ transaction ]
  next: assignMemberId

assignMemberId:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignMemberId
  govern: [ transaction ]
  next: countNamesakes

countNamesakes:
  class: org.springframework.samples.petclinic.rest.function.owner.CountNamesakes
  govern: [ transaction ]
  next: assignMembershipLevel

assignMembershipLevel:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignMembershipLevel
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: record

record:
  class: org.springframework.samples.petclinic.rest.function.owner.RecordIdempotentOwner
  govern: [ transaction ]
  next: audit

audit:
  class: org.springframework.samples.petclinic.rest.function.owner.AuditOwnerCreated
  govern: [ transaction ]
  next: auditEvent

auditEvent:
  class: org.springframework.samples.petclinic.rest.function.owner.AuditOwnerCreatedEvent
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerCreated
  govern: [ transaction ]
