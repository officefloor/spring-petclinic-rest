composition:
  authorize: "hasRole('OWNER_ADMIN')"

idempotency:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckIdempotencyKey
  next: dailyLimit

dailyLimit:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireDailyLimit
  next: require

require:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireOwnerFields
  next: validPostcode

validPostcode:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireValidPostcode
  next: normalize

normalize:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerTelephone
  next: countryLength

countryLength:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateTelephoneCountryLength
  next: email

email:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerEmail
  next: uniqueIdentity

uniqueIdentity:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireUniqueIdentity
  govern: [ transaction ]
  next: uniqueHousehold

uniqueHousehold:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireUniqueHousehold
  govern: [ transaction ]
  next: capacity

capacity:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireCityCapacity
  govern: [ transaction ]
  next: build

build:
  class: org.springframework.samples.petclinic.rest.function.owner.BuildOwner
  govern: [ transaction ]
  next: assignCode

assignCode:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignCustomerCode
  govern: [ transaction ]
  next: countNamesakes

countNamesakes:
  class: org.springframework.samples.petclinic.rest.function.owner.CountNamesakes
  govern: [ transaction ]
  next: countHousehold

countHousehold:
  class: org.springframework.samples.petclinic.rest.function.owner.CountHousehold
  govern: [ transaction ]
  next: flagDuplicate

flagDuplicate:
  class: org.springframework.samples.petclinic.rest.function.owner.FlagPossibleDuplicate
  govern: [ transaction ]
  next: capMembership

capMembership:
  class: org.springframework.samples.petclinic.rest.function.owner.CapMembershipLevel
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: recordKey

recordKey:
  class: org.springframework.samples.petclinic.rest.function.owner.RecordIdempotencyKey
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerCreated
  govern: [ transaction ]
