composition:
  authorize: "hasRole('OWNER_ADMIN')"

normalizeAddress:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerAddress
  govern: [ transaction ]
  next: validate

validate:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateOwnerFields
  govern: [ transaction ]
  next: normalizeTelephone

normalizeTelephone:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerTelephone
  govern: [ transaction ]
  next: ensureUniqueTelephone

ensureUniqueTelephone:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureUniqueTelephone
  govern: [ transaction ]
  next: ensureUniqueHousehold

ensureUniqueHousehold:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureUniqueHousehold
  govern: [ transaction ]
  next: ensureCityUnderCapacity

ensureCityUnderCapacity:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureCityUnderCapacity
  govern: [ transaction ]
  next: normalizeEmail

normalizeEmail:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerEmail
  govern: [ transaction ]
  next: ensureUniqueEmail

ensureUniqueEmail:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureUniqueEmail
  govern: [ transaction ]
  next: defaultRegistrationDate

defaultRegistrationDate:
  class: org.springframework.samples.petclinic.rest.function.owner.DefaultOwnerRegistrationDate
  govern: [ transaction ]
  next: rollRegistrationDate

rollRegistrationDate:
  class: org.springframework.samples.petclinic.rest.function.owner.RollRegistrationDateToBusinessDay
  govern: [ transaction ]
  next: ensureUnderDailyLimit

ensureUnderDailyLimit:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureUnderDailyLimit
  govern: [ transaction ]
  next: build

build:
  class: org.springframework.samples.petclinic.rest.function.owner.BuildOwner
  govern: [ transaction ]
  next: assignNamesakeCount

assignNamesakeCount:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerNamesakeCount
  govern: [ transaction ]
  next: assignBulkSignupWarning

assignBulkSignupWarning:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerBulkSignupWarning
  govern: [ transaction ]
  next: assignCustomerCode

assignCustomerCode:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerCustomerCode
  govern: [ transaction ]
  next: assignMembershipNumber

assignMembershipNumber:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerMembershipNumber
  govern: [ transaction ]
  next: assignHouseholdId

assignHouseholdId:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignHouseholdId
  govern: [ transaction ]
  next: assignHouseholdSize

assignHouseholdSize:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerHouseholdSize
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: audit

audit:
  class: org.springframework.samples.petclinic.rest.function.owner.AuditOwnerCreated
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerCreated
  govern: [ transaction ]
