composition:
  authorize: "hasRole('OWNER_ADMIN')"

idempotency:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckIdempotentCreate
  govern: [ transaction ]
  next: validate

validate:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateOwnerFields
  govern: [ transaction ]
  next: normalize

normalize:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerTelephone
  govern: [ transaction ]
  next: email

email:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerEmail
  govern: [ transaction ]
  next: emailBlocklist

emailBlocklist:
  class: org.springframework.samples.petclinic.rest.function.owner.RejectDisposableEmailDomain
  govern: [ transaction ]
  next: household

household:
  class: org.springframework.samples.petclinic.rest.function.owner.DeriveHouseholdId
  govern: [ transaction ]
  next: uniqueIdentity

uniqueIdentity:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureUniqueIdentity
  govern: [ transaction ]
  next: capacity

capacity:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureCityCapacity
  govern: [ transaction ]
  next: dailyLimit

dailyLimit:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureDailyOwnerLimit
  govern: [ transaction ]
  next: build

build:
  class: org.springframework.samples.petclinic.rest.function.owner.BuildOwner
  govern: [ transaction ]
  next: postcode

postcode:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateOwnerPostcode
  govern: [ transaction ]
  next: household-assign

household-assign:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignHousehold
  govern: [ transaction ]
  next: household-size

household-size:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignHouseholdSize
  govern: [ transaction ]
  next: membership-level-cap

membership-level-cap:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignMembershipLevelCap
  govern: [ transaction ]
  next: validateRegistrationDate

validateRegistrationDate:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateOwnerRegistrationDate
  govern: [ transaction ]
  next: registrationDate

registrationDate:
  class: org.springframework.samples.petclinic.rest.function.owner.DefaultOwnerRegistrationDate
  govern: [ transaction ]
  next: bulkSignupWarning

bulkSignupWarning:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignBulkSignupWarning
  govern: [ transaction ]
  next: capacityWarning

capacityWarning:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignCapacityWarning
  govern: [ transaction ]
  next: customerCode

customerCode:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignCustomerCode
  govern: [ transaction ]
  next: namesakeCount

namesakeCount:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignNamesakeCount
  govern: [ transaction ]
  next: membershipNumber

membershipNumber:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignMembershipNumber
  govern: [ transaction ]
  next: possibleDuplicate

possibleDuplicate:
  class: org.springframework.samples.petclinic.rest.function.owner.DetectPossibleDuplicate
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: audit

audit:
  class: org.springframework.samples.petclinic.rest.function.owner.AuditOwnerCreated
  govern: [ transaction ]
  next: recordIdempotency

recordIdempotency:
  class: org.springframework.samples.petclinic.rest.function.owner.RecordIdempotentCreate
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerCreated
  govern: [ transaction ]
