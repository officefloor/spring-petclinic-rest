composition:
  authorize: "hasRole('OWNER_ADMIN')"

idempotency:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckIdempotencyKey
  outputs:
    create: build
    replay: replayOwner

replayOwner:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithReplayedOwner

build:
  class: org.springframework.samples.petclinic.rest.function.owner.BuildOwner
  govern: [ transaction ]
  next: ensureEmailNotDisposable

ensureEmailNotDisposable:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureOwnerEmailNotDisposable
  govern: [ transaction ]
  next: ensurePostcodeWithinRegion

ensurePostcodeWithinRegion:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureOwnerPostcodeWithinRegion
  govern: [ transaction ]
  next: ensureUniqueIdentity

ensureUniqueIdentity:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureOwnerIdentityUnique
  govern: [ transaction ]
  next: ensureCityCapacity

ensureCityCapacity:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureOwnerCityWithinCapacity
  govern: [ transaction ]
  next: ensureDailyLimit

ensureDailyLimit:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureDailyOwnerLimitNotExceeded
  govern: [ transaction ]
  next: assignCustomerCode

assignCustomerCode:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerCustomerCode
  govern: [ transaction ]
  next: deduplicateCustomerCode

deduplicateCustomerCode:
  class: org.springframework.samples.petclinic.rest.function.owner.DeduplicateOwnerCustomerCode
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: recordIdempotency

recordIdempotency:
  class: org.springframework.samples.petclinic.rest.function.owner.RecordIdempotencyKey
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerCreated
  govern: [ transaction ]
