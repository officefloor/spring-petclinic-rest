composition:
  authorize: "hasRole('OWNER_ADMIN')"

checkIdempotency:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckIdempotency
  next: validate

validate:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateRequiredOwnerFields
  next: validatePostcode

validatePostcode:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateOwnerPostcode
  next: normalizeAddress

normalizeAddress:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerAddress
  next: normalizeTelephone

normalizeTelephone:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerTelephone
  next: ensureCityCapacity

ensureCityCapacity:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureCityCapacity
  next: validateRegistrationDate

validateRegistrationDate:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateRegistrationDate
  next: resolveRegistrationDate

resolveRegistrationDate:
  class: org.springframework.samples.petclinic.rest.function.owner.ResolveRegistrationDate
  next: ensureDailyLimit

ensureDailyLimit:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureDailyOwnerLimit
  next: normalizeEmail

normalizeEmail:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerEmail
  next: rejectDisposableEmail

rejectDisposableEmail:
  class: org.springframework.samples.petclinic.rest.function.owner.RejectDisposableEmail
  next: build

build:
  class: org.springframework.samples.petclinic.rest.function.owner.BuildOwner
  govern: [ transaction ]
  next: assignHouseholdId

assignHouseholdId:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignHouseholdId
  govern: [ transaction ]
  next: markDeclaredHouseholdMember

markDeclaredHouseholdMember:
  class: org.springframework.samples.petclinic.rest.function.owner.MarkDeclaredHouseholdMember
  govern: [ transaction ]
  next: ensureUniqueIdentity

ensureUniqueIdentity:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureUniqueIdentity
  govern: [ transaction ]
  next: countHouseholdMembers

countHouseholdMembers:
  class: org.springframework.samples.petclinic.rest.function.owner.CountHouseholdMembers
  govern: [ transaction ]
  next: applyRegistrationDate

applyRegistrationDate:
  class: org.springframework.samples.petclinic.rest.function.owner.ApplyRegistrationDate
  govern: [ transaction ]
  next: assignCustomerCode

assignCustomerCode:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignCustomerCode
  govern: [ transaction ]
  next: deduplicateCustomerCode

deduplicateCustomerCode:
  class: org.springframework.samples.petclinic.rest.function.owner.DeduplicateCustomerCode
  govern: [ transaction ]
  next: assignMembershipNumber

assignMembershipNumber:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignMembershipNumber
  govern: [ transaction ]
  next: countNamesakes

countNamesakes:
  class: org.springframework.samples.petclinic.rest.function.owner.CountNamesakes
  govern: [ transaction ]
  next: assignMembership

assignMembership:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignMembership
  govern: [ transaction ]
  next: capMembershipLevel

capMembershipLevel:
  class: org.springframework.samples.petclinic.rest.function.owner.CapMembershipLevel
  govern: [ transaction ]
  next: detectPossibleDuplicate

detectPossibleDuplicate:
  class: org.springframework.samples.petclinic.rest.function.owner.DetectPossibleDuplicate
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: audit

audit:
  class: org.springframework.samples.petclinic.rest.function.owner.AuditOwnerCreated
  govern: [ transaction ]
  next: emitEvent

emitEvent:
  class: org.springframework.samples.petclinic.rest.function.owner.EmitOwnerCreatedEvent
  govern: [ transaction ]
  next: resolveBulkWarning

resolveBulkWarning:
  class: org.springframework.samples.petclinic.rest.function.owner.ResolveBulkSignupWarning
  govern: [ transaction ]
  next: recordIdempotency

recordIdempotency:
  class: org.springframework.samples.petclinic.rest.function.owner.RecordIdempotencyKey
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerCreated
  govern: [ transaction ]
