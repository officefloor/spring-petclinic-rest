composition:
  authorize: "hasRole('OWNER_ADMIN')"

validate:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateOwnerFields
  govern: [ transaction ]
  next: validatePostcode

validatePostcode:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidatePostcode
  govern: [ transaction ]
  next: normalizeTelephone

normalizeTelephone:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeTelephone
  govern: [ transaction ]
  next: normalizeEmail

normalizeEmail:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeEmail
  govern: [ transaction ]
  next: rejectDisposableEmail

rejectDisposableEmail:
  class: org.springframework.samples.petclinic.rest.function.owner.RejectDisposableEmail
  govern: [ transaction ]
  next: normalizeAddress

normalizeAddress:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeAddress
  govern: [ transaction ]
  next: ensureUniqueIdentity

ensureUniqueIdentity:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureUniqueIdentity
  govern: [ transaction ]
  next: ensureUniqueHousehold

ensureUniqueHousehold:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureUniqueHousehold
  govern: [ transaction ]
  next: ensureCityCapacity

ensureCityCapacity:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureCityCapacity
  govern: [ transaction ]
  next: build

build:
  class: org.springframework.samples.petclinic.rest.function.owner.BuildOwner
  govern: [ transaction ]
  next: ensureDailyLimit

ensureDailyLimit:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureDailyLimit
  govern: [ transaction ]
  next: assignCustomerCode

assignCustomerCode:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignCustomerCode
  govern: [ transaction ]
  next: assignNamesakeCount

assignNamesakeCount:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignNamesakeCount
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: logAudit

logAudit:
  class: org.springframework.samples.petclinic.rest.function.owner.LogAuditOnCreate
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerCreated
  govern: [ transaction ]
