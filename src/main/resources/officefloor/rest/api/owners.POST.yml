composition:
  authorize: "hasRole('OWNER_ADMIN')"

checkIdempotent:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckIdempotentCreate
  govern: [ transaction ]
  next: build

build:
  class: org.springframework.samples.petclinic.rest.function.owner.BuildOwner
  govern: [ transaction ]
  next: checkEmailDomain

checkEmailDomain:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckOwnerEmailDomain
  govern: [ transaction ]
  next: checkPostcode

checkPostcode:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckOwnerPostcode
  govern: [ transaction ]
  next: assignHousehold

assignHousehold:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerHousehold
  govern: [ transaction ]
  next: checkIdentity

checkIdentity:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckOwnerIdentityUnique
  govern: [ transaction ]
  next: checkCityCapacity

checkCityCapacity:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckOwnerCityCapacity
  govern: [ transaction ]
  next: checkDailyLimit

checkDailyLimit:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckOwnerDailyLimit
  govern: [ transaction ]
  next: checkBulkSignup

checkBulkSignup:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckOwnerBulkSignup
  govern: [ transaction ]
  next: countNamesakes

countNamesakes:
  class: org.springframework.samples.petclinic.rest.function.owner.CountOwnerNamesakes
  govern: [ transaction ]
  next: checkPossibleDuplicate

checkPossibleDuplicate:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckOwnerPossibleDuplicate
  govern: [ transaction ]
  next: dedupeCustomerCode

dedupeCustomerCode:
  class: org.springframework.samples.petclinic.rest.function.owner.DeduplicateCustomerCode
  govern: [ transaction ]
  next: capMembershipLevel

capMembershipLevel:
  class: org.springframework.samples.petclinic.rest.function.owner.CapOwnerMembershipLevel
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: recordIdempotent

recordIdempotent:
  class: org.springframework.samples.petclinic.rest.function.owner.RecordIdempotentCreate
  govern: [ transaction ]
  next: audit

audit:
  class: org.springframework.samples.petclinic.rest.function.owner.AuditOwnerCreated
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerCreated
  govern: [ transaction ]
