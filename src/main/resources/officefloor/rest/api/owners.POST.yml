composition:
  authorize: "hasRole('OWNER_ADMIN')"

build:
  class: org.springframework.samples.petclinic.rest.function.owner.BuildOwner
  govern: [ transaction ]
  next: defaultRegistrationDate

defaultRegistrationDate:
  class: org.springframework.samples.petclinic.rest.function.owner.DefaultOwnerRegistrationDate
  govern: [ transaction ]
  next: ensureDailyLimit

ensureDailyLimit:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureDailyOwnerLimit
  govern: [ transaction ]
  next: normalizeCity

normalizeCity:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerCity
  govern: [ transaction ]
  next: ensureCityLimit

ensureCityLimit:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureCityOwnerLimit
  govern: [ transaction ]
  next: ensureUnique

ensureUnique:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureOwnerUnique
  govern: [ transaction ]
  next: ensureEmailUnique

ensureEmailUnique:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureOwnerEmailUnique
  govern: [ transaction ]
  next: assignMembershipNumber

assignMembershipNumber:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerMembershipNumber
  govern: [ transaction ]
  next: assignCustomerCode

assignCustomerCode:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerCustomerCode
  govern: [ transaction ]
  next: assignMembershipTier

assignMembershipTier:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerMembershipTier
  govern: [ transaction ]
  next: assignNamesakeCount

assignNamesakeCount:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerNamesakeCount
  govern: [ transaction ]
  next: assignSharesHousehold

assignSharesHousehold:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerSharesHousehold
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerCreated
  govern: [ transaction ]
