composition:
  authorize: "hasRole('OWNER_ADMIN')"

checkIdempotent:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckIdempotencyKey
  govern: [ transaction ]
  outputs:
    proceed: build

build:
  class: org.springframework.samples.petclinic.rest.function.owner.BuildOwner
  govern: [ transaction ]
  next: ensureEmailNotDisposable

ensureEmailNotDisposable:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureOwnerEmailNotDisposable
  govern: [ transaction ]
  next: ensurePostcode

ensurePostcode:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureOwnerPostcode
  govern: [ transaction ]
  next: adjustRegistrationDate

adjustRegistrationDate:
  class: org.springframework.samples.petclinic.rest.function.owner.AdjustOwnerRegistrationDate
  govern: [ transaction ]
  next: normalizeTelephone

normalizeTelephone:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerTelephone
  govern: [ transaction ]
  next: normalizeAddress

normalizeAddress:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerAddress
  govern: [ transaction ]
  next: ensureUniqueHousehold

ensureUniqueHousehold:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureUniqueOwnerHousehold
  govern: [ transaction ]
  next: ensureUniqueIdentity

ensureUniqueIdentity:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureUniqueOwnerIdentity
  govern: [ transaction ]
  next: ensureCityCapacity

ensureCityCapacity:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureCityHasCapacity
  govern: [ transaction ]
  next: ensureDailyCapacity

ensureDailyCapacity:
  class: org.springframework.samples.petclinic.rest.function.owner.EnsureDailyRegistrationCapacity
  govern: [ transaction ]
  next: assignCustomerCode

assignCustomerCode:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerCustomerCode
  govern: [ transaction ]
  next: deduplicateCustomerCode

deduplicateCustomerCode:
  class: org.springframework.samples.petclinic.rest.function.owner.DeduplicateOwnerCustomerCode
  govern: [ transaction ]
  next: countNamesakes

countNamesakes:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerNamesakeCount
  govern: [ transaction ]
  next: countHousehold

countHousehold:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerHouseholdSize
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: record

record:
  class: org.springframework.samples.petclinic.rest.function.owner.RecordIdempotencyKey
  govern: [ transaction ]
  next: audit

audit:
  class: org.springframework.samples.petclinic.rest.function.owner.AuditOwnerCreated
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerCreated
  govern: [ transaction ]
