composition:
  authorize: "hasRole('OWNER_ADMIN')"

require:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireOwnerFields
  next: requireCurrentRegistrationDate

requireCurrentRegistrationDate:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireCurrentRegistrationDate
  next: normalizeTelephone

normalizeTelephone:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerTelephone
  next: normalizeEmail

normalizeEmail:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerEmail
  next: normalizeAddress

normalizeAddress:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerAddress
  next: requirePostcode

requirePostcode:
  class: org.springframework.samples.petclinic.rest.function.owner.RequirePostcode
  next: requireUniqueIdentity

requireUniqueIdentity:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireUniqueIdentity
  govern: [ transaction ]
  next: requireCityCapacity

requireCityCapacity:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireCityCapacity
  govern: [ transaction ]
  next: requireDailyCapacity

requireDailyCapacity:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireDailyCapacity
  govern: [ transaction ]
  next: build

build:
  class: org.springframework.samples.petclinic.rest.function.owner.BuildOwner
  govern: [ transaction ]
  next: assignHouseholdId

assignHouseholdId:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignHouseholdId
  govern: [ transaction ]
  next: countHouseholdMembers

countHouseholdMembers:
  class: org.springframework.samples.petclinic.rest.function.owner.CountHouseholdMembers
  govern: [ transaction ]
  next: applyRegistrationDate

applyRegistrationDate:
  class: org.springframework.samples.petclinic.rest.function.owner.ApplyRegistrationDate
  govern: [ transaction ]
  next: assignCustomerCode

assignCustomerCode:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignCustomerCode
  govern: [ transaction ]
  next: countNamesakes

countNamesakes:
  class: org.springframework.samples.petclinic.rest.function.owner.CountNamesakes
  govern: [ transaction ]
  next: flagBulkSignup

flagBulkSignup:
  class: org.springframework.samples.petclinic.rest.function.owner.FlagBulkSignup
  govern: [ transaction ]
  next: flagPossibleDuplicate

flagPossibleDuplicate:
  class: org.springframework.samples.petclinic.rest.function.owner.FlagPossibleDuplicate
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: audit

audit:
  class: org.springframework.samples.petclinic.rest.function.owner.LogOwnerAudit
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerCreated
  govern: [ transaction ]
