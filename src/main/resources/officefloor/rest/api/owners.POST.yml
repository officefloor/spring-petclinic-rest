composition:
  authorize: "hasRole('OWNER_ADMIN')"

checkIdempotency:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckIdempotencyKey
  next: normalizeAddress

normalizeAddress:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerAddress
  govern: [ transaction ]
  next: require

require:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireOwnerFields
  govern: [ transaction ]
  next: validatePostcode

validatePostcode:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateOwnerPostcode
  govern: [ transaction ]
  next: validateRegistrationDate

validateRegistrationDate:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateOwnerRegistrationDate
  govern: [ transaction ]
  next: normalize

normalize:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerTelephone
  govern: [ transaction ]
  next: normalizeEmail

normalizeEmail:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerEmail
  govern: [ transaction ]
  next: rejectDisposableEmail

rejectDisposableEmail:
  class: org.springframework.samples.petclinic.rest.function.owner.RejectDisposableEmailDomain
  govern: [ transaction ]
  next: checkIdentity

checkIdentity:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckUniqueOwnerIdentity
  govern: [ transaction ]
  next: checkCityCapacity

checkCityCapacity:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckOwnerCityCapacity
  govern: [ transaction ]
  next: checkDailyLimit

checkDailyLimit:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckDailyOwnerLimit
  govern: [ transaction ]
  next: build

build:
  class: org.springframework.samples.petclinic.rest.function.owner.BuildOwner
  govern: [ transaction ]
  next: assignHousehold

assignHousehold:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerHousehold
  govern: [ transaction ]
  next: defaultRegistrationDate

defaultRegistrationDate:
  class: org.springframework.samples.petclinic.rest.function.owner.DefaultOwnerRegistrationDate
  govern: [ transaction ]
  next: assignMemberId

assignMemberId:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerMemberId
  govern: [ transaction ]
  next: assignNamesakeCount

assignNamesakeCount:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerNamesakeCount
  govern: [ transaction ]
  next: assignPossibleDuplicate

assignPossibleDuplicate:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerPossibleDuplicate
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: recordIdempotency

recordIdempotency:
  class: org.springframework.samples.petclinic.rest.function.owner.RecordIdempotencyKey
  govern: [ transaction ]
  next: audit

audit:
  class: org.springframework.samples.petclinic.rest.function.owner.AuditOwnerCreated
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerCreated
  govern: [ transaction ]
