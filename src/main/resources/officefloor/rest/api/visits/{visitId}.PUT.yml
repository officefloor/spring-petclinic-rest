composition:
  authorize: "hasRole('OWNER_ADMIN')"

validate:
  class: org.springframework.samples.petclinic.rest.function.visit.ValidateVisitFields
  govern: [ transaction ]
  next: load

load:
  class: org.springframework.samples.petclinic.rest.function.visit.LoadVisit
  govern: [ transaction ]
  next: apply

apply:
  class: org.springframework.samples.petclinic.rest.function.visit.ApplyVisitFields
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.visit.SaveVisit
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.visit.RespondWithVisitUpdated
  govern: [ transaction ]
