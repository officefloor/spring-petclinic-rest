composition:
  authorize: "hasRole('OWNER_ADMIN')"

load:
  class: org.springframework.samples.petclinic.rest.function.visit.LoadVisit
  govern: [ transaction ]
  next: delete

delete:
  class: org.springframework.samples.petclinic.rest.function.visit.DeleteVisit
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.common.RespondWithNoContent
  govern: [ transaction ]
