composition:
  authorize: "hasRole('VET_ADMIN')"

load:
  class: org.springframework.samples.petclinic.rest.function.vet.LoadVet
  govern: [ transaction ]
  next: delete

delete:
  class: org.springframework.samples.petclinic.rest.function.vet.DeleteVet
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.common.RespondWithNoContent
  govern: [ transaction ]
