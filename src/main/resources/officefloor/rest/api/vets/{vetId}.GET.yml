composition:
  authorize: "hasRole('VET_ADMIN')"

load:
  class: org.springframework.samples.petclinic.rest.function.vet.LoadVet
  govern: [ readonly-transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.vet.RespondWithVet
  govern: [ readonly-transaction ]
