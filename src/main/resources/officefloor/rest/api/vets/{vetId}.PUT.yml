composition:
  authorize: "hasRole('VET_ADMIN')"

validate:
  class: org.springframework.samples.petclinic.rest.function.vet.ValidateVet
  govern: [ transaction ]
  next: load

load:
  class: org.springframework.samples.petclinic.rest.function.vet.LoadVet
  govern: [ transaction ]
  next: apply

apply:
  class: org.springframework.samples.petclinic.rest.function.vet.ApplyVet
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.vet.SaveVet
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.vet.RespondWithVetUpdated
  govern: [ transaction ]
