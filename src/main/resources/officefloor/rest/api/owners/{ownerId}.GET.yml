composition:
  authorize: "hasRole('OWNER_ADMIN')"

load:
  class: org.springframework.samples.petclinic.rest.function.owner.LoadOwner
  govern: [ readonly-transaction ]
  next: assignCapacityWarning

# Recompute the capacity warning on read so it reflects the city's current membership.
assignCapacityWarning:
  class: org.springframework.samples.petclinic.rest.function.owner.AssignOwnerCapacityWarning
  govern: [ readonly-transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwner
  govern: [ readonly-transaction ]
