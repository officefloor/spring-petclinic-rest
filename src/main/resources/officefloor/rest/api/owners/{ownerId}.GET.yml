composition:
  authorize: "hasRole('OWNER_ADMIN')"

load:
  class: org.springframework.samples.petclinic.rest.function.owner.LoadOwner
  govern: [ readonly-transaction ]
  next: bulkWarning

# Populate the response-only bulkSignupWarning flag from the count of owners created today.
bulkWarning:
  class: org.springframework.samples.petclinic.rest.function.owner.FlagBulkSignup
  govern: [ readonly-transaction ]
  next: householdSize

# Populate the response-only householdSize from the count of owners sharing this owner's
# householdId, so the tier derivation can award GOLD for a 3+ member household.
householdSize:
  class: org.springframework.samples.petclinic.rest.function.owner.FlagHouseholdSize
  govern: [ readonly-transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwner
  govern: [ readonly-transaction ]
