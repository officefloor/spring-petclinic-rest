composition:
  authorize: "hasRole('OWNER_ADMIN')"

load:
  class: org.springframework.samples.petclinic.rest.function.owner.LoadOwner
  govern: [ readonly-transaction ]
  next: resolveBulkWarning

resolveBulkWarning:
  class: org.springframework.samples.petclinic.rest.function.owner.ResolveBulkSignupWarning
  govern: [ readonly-transaction ]
  next: resolveCapacityWarning

resolveCapacityWarning:
  class: org.springframework.samples.petclinic.rest.function.owner.ResolveCapacityWarning
  govern: [ readonly-transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwner
  govern: [ readonly-transaction ]
