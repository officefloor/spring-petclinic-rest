composition:
  authorize: "hasRole('OWNER_ADMIN')"

validate:
  class: org.springframework.samples.petclinic.rest.function.pet.ValidatePetFields
  govern: [ transaction ]
  next: loadOwner

loadOwner:
  class: org.springframework.samples.petclinic.rest.function.owner.LoadOwner
  govern: [ transaction ]
  next: build

build:
  class: org.springframework.samples.petclinic.rest.function.owner.BuildOwnersPet
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.pet.SavePet
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.pet.RespondWithPetCreated
  govern: [ transaction ]
