composition:
  authorize: "hasRole('OWNER_ADMIN')"

validate:
  class: org.springframework.samples.petclinic.rest.function.pet.ValidatePetFields
  govern: [ transaction ]
  next: loadOwner

loadOwner:
  class: org.springframework.samples.petclinic.rest.function.owner.LoadOwner
  govern: [ transaction ]
  next: loadPet

loadPet:
  class: org.springframework.samples.petclinic.rest.function.pet.LoadPet
  govern: [ transaction ]
  next: apply

apply:
  class: org.springframework.samples.petclinic.rest.function.pet.ApplyPetFields
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.pet.SavePet
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.common.RespondWithNoContent
  govern: [ transaction ]
