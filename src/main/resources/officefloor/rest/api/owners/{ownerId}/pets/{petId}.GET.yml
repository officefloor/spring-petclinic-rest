composition:
  authorize: "hasRole('OWNER_ADMIN')"

loadOwner:
  class: org.springframework.samples.petclinic.rest.function.owner.LoadOwner
  govern: [ readonly-transaction ]
  next: loadPet

loadPet:
  class: org.springframework.samples.petclinic.rest.function.owner.LoadOwnersPet
  govern: [ readonly-transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.pet.RespondWithPet
  govern: [ readonly-transaction ]
