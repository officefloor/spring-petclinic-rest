composition:
  authorize: "hasRole('OWNER_ADMIN')"

build:
  class: org.springframework.samples.petclinic.rest.function.visit.BuildOwnersVisit
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.visit.SaveVisit
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.visit.RespondWithVisitCreated
  govern: [ transaction ]
