composition:
  authorize: "hasRole('OWNER_ADMIN')"

# Normalize the telephone to E.164 first: it is the sole @RequestBody binding and must run
# before the DTO's E.164 pattern check would reject the raw input. It publishes the
# normalized body for the validate step, so the owner is stored with an E.164 telephone.
normalize:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerTelephone
  govern: [ transaction ]
  next: normalizeEmail

# Validate the optional email's format when present and lower-case it, so an invalid
# address is a 400 before the owner is loaded or updated.
normalizeEmail:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerEmail
  govern: [ transaction ]
  next: validateEmailDomain

# Reject a (now normalized) email whose domain is on the disposable-domain blocklist with a
# 400, before the owner is loaded or updated. An absent email is skipped.
validateEmailDomain:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateOwnerEmailDomain
  govern: [ transaction ]
  next: normalizeAddress

# Normalize the address on the already-bound body, before validation. Preferring the structured
# 'addressLine1'/'addressLine2' when present and composing them into the flat 'address', so both
# forms are accepted and an address blank once normalized is rejected as a missing field.
normalizeAddress:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerAddress
  govern: [ transaction ]
  next: validate

# Validate so a missing/blank required field is a 400 listing those fields, before the owner
# is loaded or updated. Reads the already-normalized body as a variable.
validate:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateOwnerFields
  govern: [ transaction ]
  next: validatePostcode

# Validate the optional postcode when present: it must be valid for the city's region per the
# fixed ranges, else a 400. A city with no known region accepts any 4-digit postcode; an absent
# postcode is skipped. Runs after field validation, before the owner is loaded or updated.
validatePostcode:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateOwnerPostcode
  govern: [ transaction ]
  next: load

load:
  class: org.springframework.samples.petclinic.rest.function.owner.LoadOwner
  govern: [ transaction ]
  next: apply

apply:
  class: org.springframework.samples.petclinic.rest.function.owner.ApplyOwner
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerUpdated
  govern: [ transaction ]
