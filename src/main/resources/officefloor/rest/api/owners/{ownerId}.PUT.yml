composition:
  authorize: "hasRole('OWNER_ADMIN')"

validate:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateOwner
  govern: [ transaction ]
  next: postcode

postcode:
  class: org.springframework.samples.petclinic.rest.function.owner.RequirePostcodeForCity
  govern: [ transaction ]
  next: email

email:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerEmail
  govern: [ transaction ]
  next: disposableEmail

disposableEmail:
  class: org.springframework.samples.petclinic.rest.function.owner.RequireEmailNotDisposable
  govern: [ transaction ]
  next: load

load:
  class: org.springframework.samples.petclinic.rest.function.owner.LoadOwner
  govern: [ transaction ]
  next: apply

apply:
  class: org.springframework.samples.petclinic.rest.function.owner.ApplyOwner
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerUpdated
  govern: [ transaction ]
