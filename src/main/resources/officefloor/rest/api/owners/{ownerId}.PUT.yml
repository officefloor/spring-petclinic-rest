composition:
  authorize: "hasRole('OWNER_ADMIN')"

validate:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateOwner
  govern: [ transaction ]
  next: normalizeEmail

# The email is optional; when present it must be a valid address (else a 400) and is
# stored and returned lower-cased.
normalizeEmail:
  class: org.springframework.samples.petclinic.rest.function.owner.NormalizeOwnerEmail
  govern: [ transaction ]
  next: validatePostcode

# The postcode is optional; when present it must be 4 digits and valid for the city's
# region (else a 400) before the owner is loaded or saved. Stored and returned unchanged.
validatePostcode:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateOwnerPostcode
  govern: [ transaction ]
  next: load

load:
  class: org.springframework.samples.petclinic.rest.function.owner.LoadOwner
  govern: [ transaction ]
  next: apply

apply:
  class: org.springframework.samples.petclinic.rest.function.owner.ApplyOwner
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerUpdated
  govern: [ transaction ]
