composition:
  authorize: "hasRole('OWNER_ADMIN')"

validate:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateOwner
  govern: [ transaction ]
  next: load

load:
  class: org.springframework.samples.petclinic.rest.function.owner.LoadOwner
  govern: [ transaction ]
  next: apply

apply:
  class: org.springframework.samples.petclinic.rest.function.owner.ApplyOwner
  govern: [ transaction ]
  next: checkEmailDomain

checkEmailDomain:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckOwnerEmailDomain
  govern: [ transaction ]
  next: checkPostcode

checkPostcode:
  class: org.springframework.samples.petclinic.rest.function.owner.CheckOwnerPostcode
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerUpdated
  govern: [ transaction ]
