composition:
  authorize: "hasRole('OWNER_ADMIN')"

validate:
  class: org.springframework.samples.petclinic.rest.function.owner.ValidateOwner
  govern: [ transaction ]
  next: postcode

# Validate the optional postcode WHEN PRESENT (4 digits, and within the city region's range for a
# known region). Absent postcode leaves the owner's postcode unchanged.
postcode:
  class: org.springframework.samples.petclinic.rest.function.owner.RequirePostcode
  govern: [ transaction ]
  next: load

load:
  class: org.springframework.samples.petclinic.rest.function.owner.LoadOwner
  govern: [ transaction ]
  next: apply

apply:
  class: org.springframework.samples.petclinic.rest.function.owner.ApplyOwner
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.owner.SaveOwner
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.owner.RespondWithOwnerUpdated
  govern: [ transaction ]
