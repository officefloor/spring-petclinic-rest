composition:
  authorize: "hasRole('VET_ADMIN')"

load:
  class: org.springframework.samples.petclinic.rest.function.specialty.LoadSpecialty
  govern: [ transaction ]
  next: delete

delete:
  class: org.springframework.samples.petclinic.rest.function.specialty.DeleteSpecialty
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.common.RespondWithNoContent
  govern: [ transaction ]
