composition:
  authorize: "hasRole('VET_ADMIN')"

validate:
  class: org.springframework.samples.petclinic.rest.function.specialty.ValidateSpecialty
  govern: [ transaction ]
  next: load

load:
  class: org.springframework.samples.petclinic.rest.function.specialty.LoadSpecialty
  govern: [ transaction ]
  next: apply

apply:
  class: org.springframework.samples.petclinic.rest.function.specialty.ApplySpecialty
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.specialty.SaveSpecialty
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.specialty.RespondWithSpecialtyUpdated
  govern: [ transaction ]
