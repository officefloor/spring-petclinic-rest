composition:
  authorize: "hasRole('VET_ADMIN')"

load:
  class: org.springframework.samples.petclinic.rest.function.specialty.LoadSpecialty
  govern: [ readonly-transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.specialty.RespondWithSpecialty
  govern: [ readonly-transaction ]
