composition:
  authorize: "hasRole('OWNER_ADMIN')"

load:
  class: org.springframework.samples.petclinic.rest.function.pet.LoadPet
  govern: [ transaction ]
  next: delete

delete:
  class: org.springframework.samples.petclinic.rest.function.pet.DeletePet
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.common.RespondWithNoContent
  govern: [ transaction ]
