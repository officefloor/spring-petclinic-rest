composition:
  authorize: "hasRole('OWNER_ADMIN')"

validate:
  class: org.springframework.samples.petclinic.rest.function.pet.ValidatePetDto
  govern: [ transaction ]
  next: load

load:
  class: org.springframework.samples.petclinic.rest.function.pet.LoadPet
  govern: [ transaction ]
  next: apply

apply:
  class: org.springframework.samples.petclinic.rest.function.pet.ApplyPetDto
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.pet.SavePet
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.pet.RespondWithPetUpdated
  govern: [ transaction ]
