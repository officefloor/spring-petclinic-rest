composition:
  authorize: "hasRole('ADMIN')"

build:
  class: org.springframework.samples.petclinic.rest.function.user.BuildUser
  govern: [ transaction ]
  next: save

save:
  class: org.springframework.samples.petclinic.rest.function.user.SaveUser
  govern: [ transaction ]
  next: respond

respond:
  class: org.springframework.samples.petclinic.rest.function.user.RespondWithUserCreated
  govern: [ transaction ]
