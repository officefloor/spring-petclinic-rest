components:
  schemas:
    ProblemDetail:
      title: Problem Detail
      description: The schema for all error responses.
      type: object
      properties:
        type:
          title: Type
          description: Full URL that originated the error response.
          type: string
          format: uri
          example: 'http://localhost:9966/petclinic/api/owner'
          readOnly: true
        title:
          title: Title
          description: The short error title.
          type: string
          example: NoResourceFoundException
          readOnly: true
        status:
          title: Status
          description: HTTP status code
          type: integer
          format: int32
          minimum: 400
          maximum: 600
          exclusiveMaximum: true
          example: 500
          readOnly: true
        detail:
          title: Detail
          description: The long error message.
          type: string
          example: 'No static resource api/owner.'
          readOnly: true
        timestamp:
          title: Timestamp
          description: The time the error occurred.
          type: string
          format: date-time
          example: '2024-11-23T13:59:21.3820407Z'
          readOnly: true
        schemaValidationErrors:
          title: Schema validation errors
          description: Validation errors against the OpenAPI schema.
          type: array
          items:
            $ref: '#/components/schemas/ValidationMessage'
      required:
        - type
        - title
        - status
        - detail
        - timestamp
        - schemaValidationErrors
    ValidationMessage:
      title: Validation message
      description: Messages describing a validation error.
      type: object
      properties:
        message:
          title: Message
          description: The validation message.
          type: string
          example: "[Path '/lastName'] Instance type (null) does not match any allowed primitive type (allowed: ['string'])"
          readOnly: true
      required:
        - message
      additionalProperties: true
    Specialty:
      title: Specialty
      description: Fields of specialty of vets.
      type: object
      properties:
        id:
          title: ID
          description: The ID of the specialty.
          type: integer
          format: int32
          minimum: 0
          example: 1
          readOnly: true
        name:
          title: Name
          description: The name of the specialty.
          type: string
          maxLength: 80
          minLength: 1
          example: radiology
      required:
        - id
        - name
    OwnerFields:
      title: Owner fields
      description: Editable fields of a pet owner.
      type: object
      properties:
        title:
          title: Title
          description: The optional honorific title of the pet owner (e.g. MR, MRS, MS, DR). When supplied it is used to compose the read-only salutation.
          type: string
          maxLength: 10
          example: DR
        firstName:
          title: First name
          description: The first name of the pet owner.
          type: string
          minLength: 1
          maxLength: 30
          pattern: "^[\\p{L}]+([ '-][\\p{L}]+){0,2}$"
          example: George
        lastName:
          title: Last name
          description: The last name of the pet owner.
          type: string
          minLength: 1
          maxLength: 30
          pattern: "^[\\p{L}]+([ '-][\\p{L}]+){0,2}\\.?$"
          example: Franklin
        address:
          title: Address
          description: The postal address of the pet owner. Accepted for backward compatibility; when the structured address fields are supplied they take precedence and this is returned as the composed, normalized address (normalized addressLine1, plus a single space and the normalized addressLine2 when addressLine2 is present).
          type: string
          minLength: 1
          maxLength: 255
          example: '110 W. Liberty St.'
        addressLine1:
          title: Address line 1
          description: The first line of the owner's structured postal address. When supplied (non-blank) the structured fields take precedence over the flat 'address' and are normalized (trim, collapse whitespace, upper-case, expand ST/RD/AVE).
          type: string
          maxLength: 255
          example: '110 W. Liberty St.'
        addressLine2:
          title: Address line 2
          description: The optional second line of the owner's structured postal address (e.g. unit or apartment). Normalized like addressLine1 and, when present, appended to the composed 'address' after a single space.
          type: string
          maxLength: 255
          example: 'Apt 4B'
        city:
          title: City
          description: The city of the pet owner.
          type: string
          minLength: 1
          maxLength: 80
          example: Madison
        telephone:
          title: Telephone number
          description: The telephone number of the pet owner.
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[0-9]*$'
          example: '6085551023'
        email:
          title: Email address
          description: The email address of the pet owner. Stored and returned lower-cased.
          type: string
          maxLength: 255
          example: george.franklin@example.com
        postcode:
          title: Postcode
          description: The owner's 4-digit postcode. Optional; validated only when present. When supplied it must be a 4-digit code valid for the city's canonical region (NSW 2000-2099, VIC 3000-3099, QLD 4000-4099); a city with no known region accepts any 4-digit postcode. Stored and returned when given.
          type: string
          example: '2000'
        registrationDate:
          title: Registration date
          description: The date the owner was registered, in ISO 'YYYY-MM-DD' format. Defaults to the server's current date when omitted.
          type: string
          format: date
          example: '2020-06-15'
        birthDate:
          title: Birth date
          description: The owner's date of birth, in ISO 'YYYY-MM-DD' format. Optional; when supplied it is stored and used to derive the read-only ageBand.
          type: string
          format: date
          example: '1990-01-01'
        sharesHousehold:
          title: Shares household
          description: When true, allows creating this owner even though another owner already shares its household (same last name and postcode), bypassing the household duplicate block; the owner is created as a declared household member and is not flagged as a possible duplicate. Write-only; not stored or returned.
          type: boolean
          writeOnly: true
          example: false
      required:
        - firstName
        - lastName
        - city
        - telephone
    Owner:
      title: Owner
      description: A pet owner.
      allOf:
        - $ref: '#/components/schemas/OwnerFields'
        - type: object
          properties:
            id:
              title: ID
              description: The ID of the pet owner.
              type: integer
              format: int32
              minimum: 0
              example: 1
              readOnly: true
            selfLink:
              title: Self link
              description: The canonical API path of this owner, formed as '/api/owners/' followed by the owner's id.
              type: string
              example: '/api/owners/1'
              readOnly: true
            deleted:
              title: Deleted
              description: Whether the owner has been soft-deleted. A newly created owner is false; DELETE /api/owners/{id} sets it true while retaining the record, and the create endpoint's duplicate and identity checks ignore owners flagged deleted.
              type: boolean
              example: false
              readOnly: true
            displayName:
              title: Display name
              description: The owner's name formatted as 'LastName, FirstName' from the stored names.
              type: string
              example: 'Franklin, George'
              readOnly: true
            salutation:
              title: Salutation
              description: The owner's salutation, composed as the title, a single space and the last name when a title was supplied, or just the last name when no title is given.
              type: string
              example: 'DR who'
              readOnly: true
            initials:
              title: Initials
              description: The upper-cased first letters of firstName and lastName, dot-separated with a trailing dot.
              type: string
              example: 'G.F.'
              readOnly: true
            telephoneDisplay:
              title: Telephone display
              description: The stored E.164 telephone formatted for humans as the country code, a space, then the national digits grouped in threes (e.g. '+61 412 345 678'). The raw 'telephone' field stays E.164.
              type: string
              example: '+61 412 345 678'
              readOnly: true
            customerCode:
              title: Customer code
              description: The owner's customer code, formatted '<CITY3>-<LAST3>-<NNNN>' where CITY3 is the upper-cased first three letters of the city, LAST3 the upper-cased first three letters of the last name and NNNN a per-city 4-digit zero-padded sequence.
              type: string
              example: 'SYD-SMI-0007'
              readOnly: true
            checkDigit:
              title: Check digit
              description: A single Luhn check digit (0-9) computed over the digits contained in the customerCode.
              type: integer
              format: int32
              minimum: 0
              maximum: 9
              example: 4
              readOnly: true
            householdId:
              title: Household ID
              description: A stable identifier shared by owners in the same household, computed deterministically as the first 12 hex characters of SHA-256 over '<normalizedLastName>|<postcode>'. Owners with the same last name and postcode share it automatically; it is assigned to every owner at creation.
              type: string
              example: 'A1B2C3D4'
              readOnly: true
            identityKey:
              title: Identity key
              description: The owner's duplicate-detection key, the lower-case SHA-256 hex digest (64 characters) of '<normalizedTelephone>|<lowerEmail>|<soundex(lastName)>' from the normalized telephone, the lower-cased email (empty when absent) and the Soundex code of the last name. Two owners are duplicates only when their whole identityKey is equal; owners with the same last name and postcode but different telephones have different keys and are both allowed (flagged instead as a possible duplicate).
              type: string
              example: '9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08'
              readOnly: true
            namesakeCount:
              title: Namesake count
              description: The number of existing owners that shared this owner's first and last name (compared case-insensitively) at the moment this owner was created, not counting the owner itself.
              type: integer
              format: int32
              minimum: 0
              example: 1
              readOnly: true
            membershipNumber:
              title: Membership number
              description: The owner's membership number, formatted '<customerCode>-M<YY>' where YY is the last two digits of the fiscal year (starting 1 July) of the business-day-adjusted registration date.
              type: string
              example: 'SYD-SMI-0007-M26'
              readOnly: true
            membershipPoints:
              title: Membership points
              description: The owner's membership points. Starts at 0, plus 2 when an email is present, plus 1 when namesakeCount is 0, plus 2 for a household of 3 or more owners, plus 3 when tenure spans at least one elapsed fiscal year (fiscal years start 1 July).
              type: integer
              format: int32
              minimum: 0
              example: 3
              readOnly: true
            membershipLevel:
              title: Membership level
              description: The owner's membership level, a number from 1 to 4 derived from membershipPoints as 1 (0-1 points), 2 (2-3), 3 (4-5) and 4 (6 or more), then capped by the household ceiling - a new owner's level cannot exceed one above the current maximum level among its existing household members (with no existing household member no cap applies).
              type: integer
              format: int32
              minimum: 1
              maximum: 4
              example: 2
              readOnly: true
            locality:
              title: Locality
              description: The canonical region derived from the city using a fixed city-to-region table (Sydney->NSW, Melbourne->VIC, Brisbane->QLD), or 'UNKNOWN' when the city is not in the table.
              type: string
              example: 'NSW'
              readOnly: true
            timezone:
              title: Timezone
              description: The IANA timezone name derived from the owner's locality (region) using a fixed region-to-timezone table (NSW->Australia/Sydney, VIC->Australia/Melbourne, QLD->Australia/Brisbane), or 'UNKNOWN' when the region is not in the table.
              type: string
              example: 'Australia/Sydney'
              readOnly: true
            contactPreference:
              title: Contact preference
              description: The owner's preferred contact channel, 'EMAIL' when an email is present, otherwise 'PHONE'.
              type: string
              example: 'EMAIL'
              readOnly: true
            bulkSignupWarning:
              title: Bulk signup warning
              description: True when more than 80 owners have already been created on the current business day (by registrationDate), otherwise false.
              type: boolean
              example: false
              readOnly: true
            capacityWarning:
              title: Capacity warning
              description: True when the owner's city already holds between 40 and 49 owners (compared case-insensitively with collapsed whitespace), approaching the per-city capacity limit of 50, otherwise false.
              type: boolean
              example: false
              readOnly: true
            possibleDuplicate:
              title: Possible duplicate
              description: True when, at creation, this owner was not a hard duplicate but shared an existing owner's lastName and postcode with a different telephone, otherwise false. Always false for a declared household member (created with sharesHousehold true).
              type: boolean
              example: false
              readOnly: true
            possibleDuplicateOf:
              title: Possible duplicate of
              description: The id of the existing owner this one is a possible duplicate of (same lastName and postcode, different telephone), when possibleDuplicate is true; absent otherwise.
              type: integer
              format: int32
              minimum: 0
              example: 1
              readOnly: true
            ageBand:
              title: Age band
              description: The owner's age band derived from birthDate as at registrationDate, 'MINOR' (under 18), 'ADULT' (18-64) or 'SENIOR' (65 or over). Absent when no birthDate was supplied.
              type: string
              example: 'ADULT'
              readOnly: true
            fiscalYear:
              title: Fiscal year
              description: The fiscal year of the business-day-adjusted registrationDate, formatted 'FY<YY>' (last two digits of the fiscal year), where the fiscal year starts on 1 July.
              type: string
              example: 'FY26'
              readOnly: true
            ownerSegment:
              title: Owner segment
              description: The owner's segment, formatted '<TIER>_<AREA>', one of 'PREMIUM_METRO', 'PREMIUM_REGIONAL', 'STANDARD_METRO' or 'STANDARD_REGIONAL'. TIER is 'PREMIUM' when membershipLevel is 3 or more, otherwise 'STANDARD'. AREA is 'METRO' when the locality is a known region (NSW, VIC or QLD), otherwise 'REGIONAL'.
              type: string
              example: 'STANDARD_METRO'
              readOnly: true
            pets:
              title: Pets
              description: The pets owned by this individual including any booked vet visits.
              type: array
              items:
                $ref: '#/components/schemas/Pet'
              readOnly: true
          required:
            - pets
    OwnerPage:
      title: Owner page
      description: A page of pet owners.
      type: object
      properties:
        content:
          title: Content
          description: Pet owners in the requested page.
          type: array
          items:
            $ref: '#/components/schemas/Owner'
        page:
          title: Page
          description: Zero-based page index.
          type: integer
          format: int32
          minimum: 0
          example: 0
        size:
          title: Size
          description: Requested page size.
          type: integer
          format: int32
          minimum: 1
          example: 5
        totalElements:
          title: Total elements
          description: Total number of owners matching the request.
          type: integer
          format: int64
          minimum: 0
          example: 10
        totalPages:
          title: Total pages
          description: Total number of pages matching the request.
          type: integer
          format: int32
          minimum: 0
          example: 2
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
    PetPage:
      title: Pet page
      description: A page of pets.
      type: object
      properties:
        content:
          title: Content
          description: Pets in the requested page.
          type: array
          items:
            $ref: '#/components/schemas/Pet'
        page:
          title: Page
          description: Zero-based page index.
          type: integer
          format: int32
          minimum: 0
          example: 0
        size:
          title: Size
          description: Requested page size.
          type: integer
          format: int32
          minimum: 1
          example: 5
        totalElements:
          title: Total elements
          description: Total number of pets matching the request.
          type: integer
          format: int64
          minimum: 0
          example: 10
        totalPages:
          title: Total pages
          description: Total number of pages matching the request.
          type: integer
          format: int32
          minimum: 0
          example: 2
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
    PetFields:
      title: Pet fields
      description: Editable fields of a pet.
      type: object
      properties:
        name:
          title: Name
          description: The name of the pet.
          type: string
          maxLength: 30
          example: Leo
        birthDate:
          title: Birth date
          description: The date of birth of the pet.
          type: string
          format: date
          example: '2010-09-07'
          x-field-extra-annotation: "@org.springframework.samples.petclinic.rest.validation.PetAgeValidation"
        type:
          $ref: '#/components/schemas/PetType'
      required:
        - name
        - birthDate
        - type
    Pet:
      title: Pet
      description: A pet.
      allOf:
        - $ref: '#/components/schemas/PetFields'
        - type: object
          properties:
            id:
              title: ID
              description: The ID of the pet.
              type: integer
              format: int32
              minimum: 0
              example: 1
              readOnly: true
            ownerId:
              title: Owner ID
              description: The ID of the pet's owner.
              type: integer
              format: int32
              minimum: 0
              example: 1
              readOnly: true
            visits:
              title: Visits
              description: Vet visit bookings for this pet.
              type: array
              items:
                $ref: '#/components/schemas/Visit'
              readOnly: true
          required:
            - id
            - type
            - visits
    VetFields:
      title: VetFields
      description: Editable fields of a veterinarian.
      type: object
      properties:
        firstName:
          title: First name
          description: The first name of the vet.
          type: string
          minLength: 1
          maxLength: 30
          pattern: "^[\\p{L}]+([ '-][\\p{L}]+){0,2}$"
          example: 'James'
        lastName:
          title: Last name
          description: The last name of the vet.
          type: string
          minLength: 1
          maxLength: 30
          pattern: "^[\\p{L}]+([ '-][\\p{L}]+){0,2}\\.?$"
          example: 'Carter'
        specialties:
          title: Specialties
          description: The specialties of the vet.
          type: array
          items:
            $ref: '#/components/schemas/Specialty'
      required:
        - firstName
        - lastName
        - specialties
    Vet:
      title: Vet
      description: A veterinarian.
      allOf:
        - $ref: '#/components/schemas/VetFields'
        - type: object
          properties:
            id:
              title: ID
              description: The ID of the vet.
              type: integer
              format: int32
              minimum: 0
              example: 1
              readOnly: true
      required:
        - id
        - firstName
        - lastName
        - specialties
    VisitFields:
      title: Visit fields
      description: Editable fields of a vet visit.
      type: object
      properties:
        date:
          title: Date
          description: The date of the visit.
          type: string
          format: date
          example: '2013-01-01'
        description:
          title: Description
          description: The description for the visit.
          type: string
          minLength: 1
          maxLength: 255
          example: 'rabies shot'
      required:
        - description
    Visit:
      title: Visit
      description: A booking for a vet visit.
      allOf:
        - $ref: '#/components/schemas/VisitFields'
        - type: object
          properties:
            id:
              title: ID
              description: The ID of the visit.
              type: integer
              format: int32
              minimum: 0
              example: 1
              readOnly: true
            petId:
              title: Pet ID
              description: The ID of the pet.
              type: integer
              format: int32
              minimum: 0
              example: 1
          required:
            - id
            - petId
    PetTypeFields:
      title: PetType fields
      description: Editable fields of a pet type.
      type: object
      properties:
        name:
          title: Name
          description: The name of the pet type.
          type: string
          maxLength: 80
          minLength: 1
          example: cat
      required:
        - name
    PetType:
      title: Pet type
      description: A pet type.
      allOf:
        - $ref: '#/components/schemas/PetTypeFields'
        - type: object
          properties:
            id:
              title: ID
              description: The ID of the pet type.
              type: integer
              format: int32
              minimum: 0
              example: 1
          required:
            - id
    User:
      title: User
      description: An user.
      type: object
      properties:
        username:
          title: username
          description: The username
          type: string
          maxLength: 80
          minLength: 1
          example: john.doe
        password:
          title: Password
          description: The password
          type: string
          maxLength: 80
          minLength: 1
          example: 1234abc
        enabled:
          title: enabled
          description: Indicates if the user is enabled
          type: boolean
          example: true
        roles:
          title: Roles
          description: The roles of an user
          type: array
          items:
            $ref: '#/components/schemas/Role'
      required:
        - username
    Role:
      title: Role
      description: A role.
      type: object
      properties:
        name:
          title: name
          description: The role's name
          type: string
          maxLength: 80
          minLength: 1
          example: admin
      required:
        - name
