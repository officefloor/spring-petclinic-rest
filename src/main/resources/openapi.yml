components:
  schemas:
    ProblemDetail:
      title: Problem Detail
      description: The schema for all error responses.
      type: object
      properties:
        type:
          title: Type
          description: Full URL that originated the error response.
          type: string
          format: uri
          example: 'http://localhost:9966/petclinic/api/owner'
          readOnly: true
        title:
          title: Title
          description: The short error title.
          type: string
          example: NoResourceFoundException
          readOnly: true
        status:
          title: Status
          description: HTTP status code
          type: integer
          format: int32
          minimum: 400
          maximum: 600
          exclusiveMaximum: true
          example: 500
          readOnly: true
        detail:
          title: Detail
          description: The long error message.
          type: string
          example: 'No static resource api/owner.'
          readOnly: true
        timestamp:
          title: Timestamp
          description: The time the error occurred.
          type: string
          format: date-time
          example: '2024-11-23T13:59:21.3820407Z'
          readOnly: true
        schemaValidationErrors:
          title: Schema validation errors
          description: Validation errors against the OpenAPI schema.
          type: array
          items:
            $ref: '#/components/schemas/ValidationMessage'
      required:
        - type
        - title
        - status
        - detail
        - timestamp
        - schemaValidationErrors
    ValidationMessage:
      title: Validation message
      description: Messages describing a validation error.
      type: object
      properties:
        message:
          title: Message
          description: The validation message.
          type: string
          example: "[Path '/lastName'] Instance type (null) does not match any allowed primitive type (allowed: ['string'])"
          readOnly: true
      required:
        - message
      additionalProperties: true
    Specialty:
      title: Specialty
      description: Fields of specialty of vets.
      type: object
      properties:
        id:
          title: ID
          description: The ID of the specialty.
          type: integer
          format: int32
          minimum: 0
          example: 1
          readOnly: true
        name:
          title: Name
          description: The name of the specialty.
          type: string
          maxLength: 80
          minLength: 1
          example: radiology
      required:
        - id
        - name
    OwnerFields:
      title: Owner fields
      description: Editable fields of a pet owner.
      type: object
      properties:
        title:
          title: Title
          description: >-
            The optional honorific title of the pet owner (typically one of MR,
            MRS, MS or DR). When present it is combined with the last name to
            form the derived 'salutation'.
          type: string
          maxLength: 10
          example: DR
        firstName:
          title: First name
          description: The first name of the pet owner.
          type: string
          minLength: 1
          maxLength: 30
          pattern: "^[\\p{L}]+([ '-][\\p{L}]+){0,2}$"
          example: George
        lastName:
          title: Last name
          description: The last name of the pet owner.
          type: string
          minLength: 1
          maxLength: 30
          pattern: "^[\\p{L}]+([ '-][\\p{L}]+){0,2}\\.?$"
          example: Franklin
        address:
          title: Address
          description: >-
            The postal address of the pet owner. Accepted as a flat input for
            backward compatibility; when the structured 'addressLine1' (and
            optional 'addressLine2') is supplied it is preferred. On read this is
            the composed, normalized address: the normalized 'addressLine1', with
            a single space and the normalized 'addressLine2' appended when
            present.
          type: string
          minLength: 1
          maxLength: 255
          example: '110 W. Liberty St.'
        addressLine1:
          title: Address line 1
          description: >-
            The first line of the structured postal address. Preferred over the
            flat 'address' when supplied. Normalized like 'address' on create.
          type: string
          minLength: 1
          maxLength: 255
          example: '110 W. Liberty St.'
        addressLine2:
          title: Address line 2
          description: >-
            The optional second line of the structured postal address. When
            present it is normalized and appended to 'addressLine1' in the
            composed 'address'.
          type: string
          maxLength: 255
          example: 'Apt 4'
        city:
          title: City
          description: The city of the pet owner.
          type: string
          minLength: 1
          maxLength: 80
          example: Madison
        telephone:
          title: Telephone number
          description: >-
            The telephone number of the pet owner. On create, the value is
            normalized to E.164 form: a leading '+' and country code are kept
            when present, otherwise country code '+61' is assumed and a single
            leading '0' is dropped from the national digits; spaces, dashes and
            brackets are stripped. The result must have 8 to 15 digits after the
            '+'.
          type: string
          minLength: 1
          maxLength: 20
          example: '+61412345678'
        email:
          title: Email address
          description: >-
            The optional email address of the pet owner. When present it must be
            a syntactically valid address; it is stored and returned lower-cased.
          type: string
          maxLength: 255
          example: 'george.franklin@example.com'
        postcode:
          title: Postcode
          description: >-
            The optional 4-digit postcode of the pet owner. When present it must be
            valid for the owner's city per a fixed region table (Sydney/NSW
            2000-2099, Melbourne/VIC 3000-3099, Brisbane/QLD 4000-4099); a city with
            no known region accepts any 4-digit postcode. Stored and returned when
            given.
          type: string
          example: '2000'
        registrationDate:
          title: Registration date
          description: >-
            The date the pet owner was registered, in ISO 'YYYY-MM-DD' format.
            Optional on create; when omitted the server sets it to its current
            date.
          type: string
          format: date
          example: '2020-06-15'
        birthDate:
          title: Birth date
          description: >-
            The optional date of birth of the pet owner, in ISO 'YYYY-MM-DD'
            format. When present it drives the derived 'ageBand'.
          type: string
          format: date
          example: '1990-01-01'
        sharesHousehold:
          title: Shares household
          description: >-
            Create-only flag. The householdId is always derived automatically from
            the last name and postcode, so owners sharing those already share a
            household. When true, this flag only bypasses the duplicate block: the
            owner is created as a declared household member even though another owner
            is already in the same household (same last name and postcode, for
            example family members living together), and it is not flagged as a
            possible duplicate. Defaults to false.
          type: boolean
          default: false
          writeOnly: true
          example: false
      required:
        - firstName
        - lastName
        - city
        - telephone
    OwnerIdentity:
      title: Owner identity
      description: >-
        The owner's grouped version-2 identity. All three identifiers are derived
        under the version-2 algorithm that mixes a fixed 'V2' version tag into the
        region code used inside them, so no value reproduces a version-1 identifier.
        The version tag stays confined to these identifiers and never appears in the
        user-facing 'locality', 'timezone' or 'ownerSegment'.
      type: object
      properties:
        memberId:
          title: Member ID
          description: >-
            The owner's unified member id, formatted '<REGIONV2><FY><HASH8><CHK>'
            where REGIONV2 is the version-2 region code (the region the owner's
            postcode derives to - falling back to the city table when the postcode is
            absent or in no known range - with the fixed 'V2' version tag mixed in),
            FY is the two-digit fiscal year of the business-day-adjusted
            registrationDate, HASH8 is the first eight upper-case hex characters of
            the SHA-256 digest of the normalized telephone concatenated with the last
            name, and CHK is a single Luhn check digit over the digit characters of
            the body. Assigned at creation.
          type: string
          example: 'NSWV227A2B3C4D4'
          readOnly: true
        householdId:
          title: Household ID
          description: >-
            A stable identifier shared by owners that live in the same household,
            derived deterministically under the version-2 algorithm as the first 12
            upper-case hex characters of the SHA-256 digest of the fixed 'V2' version
            tag, the normalized last name and the postcode joined with '|'. Any two
            owners with the same last name and postcode therefore carry the same value
            automatically, regardless of creation order. Absent for owners created
            without a postcode.
          type: string
          example: 'A1B2C3D4E5F6'
          readOnly: true
        identityKey:
          title: Identity key
          description: >-
            The owner's derived duplicate-detection key: the full lower-case
            hexadecimal SHA-256 digest of the fixed 'V2' version tag, the normalized
            telephone, the lower-cased email (empty when absent) and the Soundex code
            of the last name, joined with '|'. Two owners are duplicates only when
            their whole identityKey is equal; a create whose identityKey matches an
            existing owner's is rejected with 409.
          type: string
          readOnly: true
    Owner:
      title: Owner
      description: A pet owner.
      allOf:
        - $ref: '#/components/schemas/OwnerFields'
        - type: object
          properties:
            id:
              title: ID
              description: The ID of the pet owner.
              type: integer
              format: int32
              minimum: 0
              example: 1
              readOnly: true
            selfLink:
              title: Self link
              description: >-
                A link to this owner's own resource, formed at read time as
                '/api/owners/' followed by the owner's id.
              type: string
              example: '/api/owners/1'
              readOnly: true
            displayName:
              title: Display name
              description: The owner's name formatted as 'LastName, FirstName'.
              type: string
              example: 'Franklin, George'
              readOnly: true
            salutation:
              title: Salutation
              description: >-
                The owner's salutation, derived at read time as the honorific
                'title' and last name separated by a single space (e.g. 'DR
                Franklin'), or just the last name when no title was given.
              type: string
              example: 'DR Franklin'
              readOnly: true
            telephoneDisplay:
              title: Telephone display
              description: >-
                The stored E.164 'telephone' formatted for humans: a '+' and the
                country code, a space, then the national digits grouped in threes
                (e.g. '+61412345678' -> '+61 412 345 678'). Raw 'telephone' stays
                in E.164 form.
              type: string
              example: '+61 412 345 678'
              readOnly: true
            initials:
              title: Initials
              description: >-
                The upper-cased first letters of firstName and lastName,
                dot-separated with a trailing dot.
              type: string
              example: 'G.F.'
              readOnly: true
            identity:
              title: Identity
              description: >-
                The owner's version-2 identity: the memberId, householdId and
                identityKey grouped together. Every identifier is derived under the
                version-2 algorithm, which mixes a fixed 'V2' version tag into the
                region code embedded inside the identifiers, so each value differs
                from and never reproduces a version-1 identifier. The version tag
                stays inside these identifiers and never appears in the user-facing
                'locality', 'timezone' or 'ownerSegment'.
              readOnly: true
              allOf:
                - $ref: '#/components/schemas/OwnerIdentity'
            apiVersion:
              title: API version
              description: >-
                The version of the owner representation, fixed at 2 for the
                version-2 identity release.
              type: integer
              format: int32
              example: 2
              readOnly: true
            namesakeCount:
              title: Namesake count
              description: >-
                The number of owners that already existed at the time this owner
                was created sharing the same first name and last name, compared
                case-insensitively.
              type: integer
              format: int32
              minimum: 0
              example: 1
              readOnly: true
            fiscalYear:
              title: Fiscal year
              description: >-
                The fiscal year the owner's business-day-adjusted
                registrationDate falls in, formatted 'FY<YY>' where YY is the
                last two digits of the fiscal year. The fiscal year starts on 1
                July and is named by the calendar year it ends in, so a
                registration on 2026-08-03 yields 'FY27'. Derived at read time;
                absent when no registrationDate is present.
              type: string
              example: 'FY27'
              readOnly: true
            bulkSignupWarning:
              title: Bulk signup warning
              description: >-
                Flag captured at creation time: true when more than 80 owners
                had already been created for the same day at the time this owner
                was created, otherwise false.
              type: boolean
              example: false
              readOnly: true
            capacityWarning:
              title: Capacity warning
              description: >-
                Flag captured at creation time: true when the owner's city already
                held between 40 and 49 owners (approaching the capacity limit of 50)
                at the time this owner was created, otherwise false.
              type: boolean
              example: false
              readOnly: true
            membershipPoints:
              title: Membership points
              description: >-
                The owner's membership points, assigned at creation starting at 0:
                plus 2 when an email is present, plus 1 when namesakeCount is 0, plus
                2 for a household of 3 or more, plus 3 for tenure over 1 elapsed fiscal year.
              type: integer
              format: int32
              minimum: 0
              example: 3
              readOnly: true
            membershipLevel:
              title: Membership level
              description: >-
                The owner's membership level, derived at creation from
                membershipPoints: 1 for 0-1 points, 2 for 2-3, 3 for 4-5, and 4 for
                6 or more points.
              type: integer
              format: int32
              minimum: 1
              maximum: 4
              example: 2
              readOnly: true
            locality:
              title: Locality
              description: >-
                The owner's region, read at read time from the leading REGION
                segment of the memberId, so it shares the single region-and-hash
                identity assigned at creation. 'UNKNOWN' when no region can be
                resolved.
              type: string
              example: 'NSW'
              readOnly: true
            timezone:
              title: Timezone
              description: >-
                The owner's IANA timezone, derived at read time from the
                locality/region via a fixed region-to-timezone table:
                NSW->Australia/Sydney, VIC->Australia/Melbourne,
                QLD->Australia/Brisbane. Absent when no region can be resolved.
              type: string
              example: 'Australia/Sydney'
              readOnly: true
            contactPreference:
              title: Contact preference
              description: >-
                The owner's preferred contact channel, derived at read time:
                'EMAIL' when an email is present, otherwise 'PHONE'.
              type: string
              example: 'EMAIL'
              readOnly: true
            ownerSegment:
              title: Owner segment
              description: >-
                The owner's marketing segment, derived at read time and formatted
                '<TIER>_<AREA>'. TIER is 'PREMIUM' when membershipLevel is 3 or
                more, otherwise 'STANDARD'. AREA is 'METRO' when the locality is a
                known region (NSW, VIC or QLD), otherwise 'REGIONAL'. One of
                'PREMIUM_METRO', 'PREMIUM_REGIONAL', 'STANDARD_METRO' or
                'STANDARD_REGIONAL'.
              type: string
              example: 'STANDARD_METRO'
              readOnly: true
            ageBand:
              title: Age band
              description: >-
                The owner's age band, derived at read time from 'birthDate'
                against 'registrationDate': 'MINOR' when under 18, 'ADULT' from
                18 to 64, 'SENIOR' at 65 or over. Absent when no birthDate is
                given.
              type: string
              example: 'ADULT'
              readOnly: true
            possibleDuplicate:
              title: Possible duplicate
              description: >-
                Flag captured at creation time: true when the owner is not a hard
                duplicate but shares an existing owner's last name and postcode
                while carrying a different telephone, otherwise false.
              type: boolean
              example: false
              readOnly: true
            possibleDuplicateOf:
              title: Possible duplicate of
              description: >-
                The id of the existing owner this owner is a possible duplicate of,
                captured at creation time. Present only when 'possibleDuplicate' is
                true.
              type: integer
              format: int32
              minimum: 0
              example: 1
              readOnly: true
            riskFlag:
              title: Risk flag
              description: >-
                Derived risk indicator: true when any of the following hold - the
                owner is a possible duplicate (possibleDuplicate is true), the
                email domain is disposable-adjacent (equal to, a subdomain of, or
                sharing the second-level label of a known disposable domain), or
                the owner's city is over its soft capacity (capacityWarning is
                true). Otherwise false.
              type: boolean
              example: false
              readOnly: true
            deleted:
              title: Deleted
              description: >-
                Whether the owner has been soft-deleted. A newly created owner is
                false. DELETE /api/owners/{id} marks the owner deleted (true) while
                retaining the record, and the create endpoint's duplicate and
                identity checks ignore owners flagged deleted.
              type: boolean
              example: false
              readOnly: true
            pets:
              title: Pets
              description: The pets owned by this individual including any booked vet visits.
              type: array
              items:
                $ref: '#/components/schemas/Pet'
              readOnly: true
          required:
            - pets
    OwnerPage:
      title: Owner page
      description: A page of pet owners.
      type: object
      properties:
        content:
          title: Content
          description: Pet owners in the requested page.
          type: array
          items:
            $ref: '#/components/schemas/Owner'
        page:
          title: Page
          description: Zero-based page index.
          type: integer
          format: int32
          minimum: 0
          example: 0
        size:
          title: Size
          description: Requested page size.
          type: integer
          format: int32
          minimum: 1
          example: 5
        totalElements:
          title: Total elements
          description: Total number of owners matching the request.
          type: integer
          format: int64
          minimum: 0
          example: 10
        totalPages:
          title: Total pages
          description: Total number of pages matching the request.
          type: integer
          format: int32
          minimum: 0
          example: 2
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
    PetPage:
      title: Pet page
      description: A page of pets.
      type: object
      properties:
        content:
          title: Content
          description: Pets in the requested page.
          type: array
          items:
            $ref: '#/components/schemas/Pet'
        page:
          title: Page
          description: Zero-based page index.
          type: integer
          format: int32
          minimum: 0
          example: 0
        size:
          title: Size
          description: Requested page size.
          type: integer
          format: int32
          minimum: 1
          example: 5
        totalElements:
          title: Total elements
          description: Total number of pets matching the request.
          type: integer
          format: int64
          minimum: 0
          example: 10
        totalPages:
          title: Total pages
          description: Total number of pages matching the request.
          type: integer
          format: int32
          minimum: 0
          example: 2
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
    PetFields:
      title: Pet fields
      description: Editable fields of a pet.
      type: object
      properties:
        name:
          title: Name
          description: The name of the pet.
          type: string
          maxLength: 30
          example: Leo
        birthDate:
          title: Birth date
          description: The date of birth of the pet.
          type: string
          format: date
          example: '2010-09-07'
          x-field-extra-annotation: "@org.springframework.samples.petclinic.rest.validation.PetAgeValidation"
        type:
          $ref: '#/components/schemas/PetType'
      required:
        - name
        - birthDate
        - type
    Pet:
      title: Pet
      description: A pet.
      allOf:
        - $ref: '#/components/schemas/PetFields'
        - type: object
          properties:
            id:
              title: ID
              description: The ID of the pet.
              type: integer
              format: int32
              minimum: 0
              example: 1
              readOnly: true
            ownerId:
              title: Owner ID
              description: The ID of the pet's owner.
              type: integer
              format: int32
              minimum: 0
              example: 1
              readOnly: true
            visits:
              title: Visits
              description: Vet visit bookings for this pet.
              type: array
              items:
                $ref: '#/components/schemas/Visit'
              readOnly: true
          required:
            - id
            - type
            - visits
    VetFields:
      title: VetFields
      description: Editable fields of a veterinarian.
      type: object
      properties:
        firstName:
          title: First name
          description: The first name of the vet.
          type: string
          minLength: 1
          maxLength: 30
          pattern: "^[\\p{L}]+([ '-][\\p{L}]+){0,2}$"
          example: 'James'
        lastName:
          title: Last name
          description: The last name of the vet.
          type: string
          minLength: 1
          maxLength: 30
          pattern: "^[\\p{L}]+([ '-][\\p{L}]+){0,2}\\.?$"
          example: 'Carter'
        specialties:
          title: Specialties
          description: The specialties of the vet.
          type: array
          items:
            $ref: '#/components/schemas/Specialty'
      required:
        - firstName
        - lastName
        - specialties
    Vet:
      title: Vet
      description: A veterinarian.
      allOf:
        - $ref: '#/components/schemas/VetFields'
        - type: object
          properties:
            id:
              title: ID
              description: The ID of the vet.
              type: integer
              format: int32
              minimum: 0
              example: 1
              readOnly: true
      required:
        - id
        - firstName
        - lastName
        - specialties
    VisitFields:
      title: Visit fields
      description: Editable fields of a vet visit.
      type: object
      properties:
        date:
          title: Date
          description: The date of the visit.
          type: string
          format: date
          example: '2013-01-01'
        description:
          title: Description
          description: The description for the visit.
          type: string
          minLength: 1
          maxLength: 255
          example: 'rabies shot'
      required:
        - description
    Visit:
      title: Visit
      description: A booking for a vet visit.
      allOf:
        - $ref: '#/components/schemas/VisitFields'
        - type: object
          properties:
            id:
              title: ID
              description: The ID of the visit.
              type: integer
              format: int32
              minimum: 0
              example: 1
              readOnly: true
            petId:
              title: Pet ID
              description: The ID of the pet.
              type: integer
              format: int32
              minimum: 0
              example: 1
          required:
            - id
            - petId
    PetTypeFields:
      title: PetType fields
      description: Editable fields of a pet type.
      type: object
      properties:
        name:
          title: Name
          description: The name of the pet type.
          type: string
          maxLength: 80
          minLength: 1
          example: cat
      required:
        - name
    PetType:
      title: Pet type
      description: A pet type.
      allOf:
        - $ref: '#/components/schemas/PetTypeFields'
        - type: object
          properties:
            id:
              title: ID
              description: The ID of the pet type.
              type: integer
              format: int32
              minimum: 0
              example: 1
          required:
            - id
    User:
      title: User
      description: An user.
      type: object
      properties:
        username:
          title: username
          description: The username
          type: string
          maxLength: 80
          minLength: 1
          example: john.doe
        password:
          title: Password
          description: The password
          type: string
          maxLength: 80
          minLength: 1
          example: 1234abc
        enabled:
          title: enabled
          description: Indicates if the user is enabled
          type: boolean
          example: true
        roles:
          title: Roles
          description: The roles of an user
          type: array
          items:
            $ref: '#/components/schemas/Role'
      required:
        - username
    Role:
      title: Role
      description: A role.
      type: object
      properties:
        name:
          title: name
          description: The role's name
          type: string
          maxLength: 80
          minLength: 1
          example: admin
      required:
        - name
