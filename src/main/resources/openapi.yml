components:
  schemas:
    ProblemDetail:
      title: Problem Detail
      description: The schema for all error responses.
      type: object
      properties:
        type:
          title: Type
          description: Full URL that originated the error response.
          type: string
          format: uri
          example: 'http://localhost:9966/petclinic/api/owner'
          readOnly: true
        title:
          title: Title
          description: The short error title.
          type: string
          example: NoResourceFoundException
          readOnly: true
        status:
          title: Status
          description: HTTP status code
          type: integer
          format: int32
          minimum: 400
          maximum: 600
          exclusiveMaximum: true
          example: 500
          readOnly: true
        detail:
          title: Detail
          description: The long error message.
          type: string
          example: 'No static resource api/owner.'
          readOnly: true
        timestamp:
          title: Timestamp
          description: The time the error occurred.
          type: string
          format: date-time
          example: '2024-11-23T13:59:21.3820407Z'
          readOnly: true
        schemaValidationErrors:
          title: Schema validation errors
          description: Validation errors against the OpenAPI schema.
          type: array
          items:
            $ref: '#/components/schemas/ValidationMessage'
      required:
        - type
        - title
        - status
        - detail
        - timestamp
        - schemaValidationErrors
    ValidationMessage:
      title: Validation message
      description: Messages describing a validation error.
      type: object
      properties:
        message:
          title: Message
          description: The validation message.
          type: string
          example: "[Path '/lastName'] Instance type (null) does not match any allowed primitive type (allowed: ['string'])"
          readOnly: true
      required:
        - message
      additionalProperties: true
    Specialty:
      title: Specialty
      description: Fields of specialty of vets.
      type: object
      properties:
        id:
          title: ID
          description: The ID of the specialty.
          type: integer
          format: int32
          minimum: 0
          example: 1
          readOnly: true
        name:
          title: Name
          description: The name of the specialty.
          type: string
          maxLength: 80
          minLength: 1
          example: radiology
      required:
        - id
        - name
    OwnerFields:
      title: Owner fields
      description: Editable fields of a pet owner.
      type: object
      properties:
        title:
          title: Title
          description: >-
            Optional honorific title of the pet owner (MR, MRS, MS or DR). When present it is
            combined with the last name to form the 'salutation'.
          type: string
          maxLength: 10
          example: DR
        firstName:
          title: First name
          description: The first name of the pet owner.
          type: string
          minLength: 1
          maxLength: 30
          pattern: "^[\\p{L}]+([ '-][\\p{L}]+){0,2}$"
          example: George
        lastName:
          title: Last name
          description: The last name of the pet owner.
          type: string
          minLength: 1
          maxLength: 30
          pattern: "^[\\p{L}]+([ '-][\\p{L}]+){0,2}\\.?$"
          example: Franklin
        address:
          title: Address
          description: >-
            The postal address of the pet owner. Accepted on input for backward compatibility;
            when structured address fields are supplied they take precedence. On output this is the
            composed address: the normalized addressLine1, with a single space and the normalized
            addressLine2 appended when addressLine2 is present.
          type: string
          minLength: 1
          maxLength: 255
          example: '110 W. Liberty St.'
        addressLine1:
          title: Address line 1
          description: >-
            The first line of the structured postal address. Preferred over the flat 'address' when
            present. Normalized like 'address' (trim/collapse whitespace, upper-case, expand
            ST/RD/AVE) and stored and returned when supplied.
          type: string
          minLength: 1
          maxLength: 255
          example: '110 W. Liberty St.'
        addressLine2:
          title: Address line 2
          description: >-
            The optional second line of the structured postal address (e.g. unit or level).
            Normalized like addressLine1 and appended to the composed 'address' when present.
          type: string
          maxLength: 255
          example: 'Unit 4'
        city:
          title: City
          description: The city of the pet owner.
          type: string
          minLength: 1
          maxLength: 80
          example: Madison
        postcode:
          title: Postcode
          description: >-
            Optional 4-digit postcode. When present it must be valid for the owner's city per the
            fixed region table (NSW 2000-2099, VIC 3000-3099, QLD 4000-4099); a city with no known
            region accepts any 4-digit postcode. Stored and returned when supplied.
          type: string
          pattern: '^[0-9]{4}$'
          example: '2000'
        telephone:
          title: Telephone number
          description: The telephone number of the pet owner.
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[0-9]*$'
          example: '6085551023'
        email:
          title: Email address
          description: The email address of the pet owner. Stored and returned lower-cased.
          type: string
          format: email
          maxLength: 255
          example: george.franklin@example.com
        registrationDate:
          title: Registration date
          description: The date the pet owner was registered. Defaults to the server's current date when omitted.
          type: string
          format: date
          example: '2020-06-15'
        birthDate:
          title: Birth date
          description: >-
            Optional date of birth (ISO 8601). When present the owner's ageBand is derived from it,
            computed against the registrationDate.
          type: string
          format: date
          example: '1990-01-01'
        sharesHousehold:
          title: Shares household
          description: >-
            When true, allow creating this owner even if another owner already has the same
            last name at the same address (they share a household). Write-only; never stored.
          type: boolean
          writeOnly: true
          example: false
      required:
        - firstName
        - lastName
        - city
        - telephone
    OwnerIdentity:
      title: Owner identity
      description: >-
        The owner's version-2 identity: the three identifiers grouped together. Each is rederived
        with a fixed 'V2' version tag mixed in, so no value produced under version 1 is produced again.
      type: object
      properties:
        memberId:
          title: Member ID
          description: "Assigned identifier formatted '<REGION><FY><HASH8><CHK>': the version-2 region code (the plain region derived from the postcode with the fixed 'V2' tag mixed in, e.g. 'NSWV2'), the 2-digit fiscal year (the same YY as 'fiscalYear') of the business-day-adjusted registrationDate, the first 8 upper-case hex characters of SHA-256 over the normalized (E.164) telephone concatenated with lastName, and a single Luhn check digit computed over the digits of '<REGION><FY><HASH8>'."
          type: string
          example: 'NSWV2273C70EBD84'
          readOnly: true
        identityKey:
          title: Identity key
          description: >-
            Derived duplicate-detection key: the 64-hex SHA-256 over
            "'V2'|normalizedTelephone|lowerEmail|soundex(lastName)" - the version-2 derivation that
            mixes in the fixed 'V2' tag. Two owners with an equal identityKey are the same identity;
            creating a second owner with an existing key is rejected with 409.
          type: string
          example: 'a3f2c9b710d4e5f6a3f2c9b710d4e5f6a3f2c9b710d4e5f6a3f2c9b710d4e5f6'
          readOnly: true
        householdId:
          title: Household ID
          description: >-
            Stable identifier shared by all owners of one household (same last name at the same
            postcode): the first 12 hex characters of SHA-256 over "'V2'|normalizedLastName|postcode",
            the version-2 derivation that mixes in the fixed 'V2' tag.
          type: string
          example: '3f2a9c7b10d4'
          readOnly: true
    Owner:
      title: Owner
      description: A pet owner.
      allOf:
        - $ref: '#/components/schemas/OwnerFields'
        - type: object
          properties:
            id:
              title: ID
              description: The ID of the pet owner.
              type: integer
              format: int32
              minimum: 0
              example: 1
              readOnly: true
            selfLink:
              title: Self link
              description: The canonical API path of this owner, '/api/owners/' followed by the owner's id.
              type: string
              example: '/api/owners/1'
              readOnly: true
            displayName:
              title: Display name
              description: The pet owner's name formatted as 'LastName, FirstName'.
              type: string
              example: 'Franklin, George'
              readOnly: true
            salutation:
              title: Salutation
              description: >-
                The pet owner's salutation: the title and last name separated by a single space
                (e.g. 'DR Franklin'), or just the last name when no title was supplied.
              type: string
              example: 'DR Franklin'
              readOnly: true
            initials:
              title: Initials
              description: The upper-cased first letters of firstName and lastName, dot-separated with a trailing dot.
              type: string
              example: 'G.F.'
              readOnly: true
            telephoneDisplay:
              title: Telephone display
              description: >-
                The stored E.164 telephone formatted for humans: the '+' and country code, a space,
                then the national digits grouped in threes. The raw 'telephone' stays E.164.
              type: string
              example: '+61 412 345 678'
              readOnly: true
            apiVersion:
              title: API version
              description: The version of the owner identity contract. Always 2 (identity v2).
              type: integer
              format: int32
              example: 2
              readOnly: true
            identity:
              $ref: '#/components/schemas/OwnerIdentity'
            fiscalYear:
              title: Fiscal year
              description: "The fiscal year, formatted 'FY<YY>', of the business-day-adjusted registrationDate. The fiscal year runs 1 July - 30 June and is named by the calendar year in which it ends (YY is that year's last two digits)."
              type: string
              example: 'FY27'
              readOnly: true
            namesakeCount:
              title: Namesake count
              description: >-
                The number of existing owners (before this owner was created) sharing the same
                firstName and lastName, compared case-insensitively.
              type: integer
              format: int32
              minimum: 0
              example: 1
              readOnly: true
            membershipPoints:
              title: Membership points
              description: >-
                Numeric membership points assigned on creation. Starts at 0; add 2 when an email
                address is present; add 1 when this owner has no namesakes (namesakeCount is 0);
                add 2 for a household of 3 or more members; add 3 when the owner's tenure spans
                more than one elapsed fiscal year.
              type: integer
              format: int32
              minimum: 0
              example: 3
              readOnly: true
            membershipLevel:
              title: Membership level
              description: >-
                Numeric membership level derived from membershipPoints: 1 for 0-1 points, 2 for
                2-3 points, 3 for 4-5 points, 4 for 6 or more points.
              type: integer
              format: int32
              minimum: 1
              maximum: 4
              example: 2
              readOnly: true
            bulkSignupWarning:
              title: Bulk signup warning
              description: >-
                'true' when more than 80 owners had already been created today (by the adjusted
                business-day registrationDate) at the moment this owner was created; otherwise 'false'.
              type: boolean
              example: false
              readOnly: true
            capacityWarning:
              title: Capacity warning
              description: >-
                'true' when this owner's city already held between 40 and 49 owners (approaching the
                per-city capacity limit of 50) at the moment this owner was created; otherwise 'false'.
              type: boolean
              example: false
              readOnly: true
            possibleDuplicate:
              title: Possible duplicate
              description: >-
                'true' when this owner is not a hard (identityKey) duplicate but, at the moment it
                was created, shared an existing owner's lastName and postcode while having a
                different telephone; otherwise 'false'.
              type: boolean
              example: false
              readOnly: true
            possibleDuplicateOf:
              title: Possible duplicate of
              description: >-
                The id of the existing owner this owner was flagged a possible duplicate of (same
                lastName and postcode, different telephone). Absent when 'possibleDuplicate' is false.
              type: integer
              format: int32
              minimum: 0
              example: 1
              readOnly: true
            riskFlag:
              title: Risk flag
              description: >-
                'true' when any risk signal holds for this owner: it is a possible duplicate
                (possibleDuplicate), its email domain is disposable-adjacent (shares a label
                with a known disposable domain without being exactly blocklisted), or its city
                is over its soft capacity (the approaching-capacity capacityWarning); otherwise
                'false'.
              type: boolean
              example: false
              readOnly: true
            locality:
              title: Locality
              description: >-
                The plain region code of the owner (postcode range first - NSW 2000-2099,
                VIC 3000-3099, QLD 4000-4099 - then the fixed city table Sydney->NSW,
                Melbourne->VIC, Brisbane->QLD, else 'UNKNOWN'). This is the user-facing region and
                never carries the 'V2' identifier tag, so it stays e.g. 'NSW' even though the
                memberId's internal region is 'NSWV2'.
              type: string
              example: 'NSW'
              readOnly: true
            timezone:
              title: Timezone
              description: >-
                The owner's IANA timezone, derived from the locality/region via the fixed
                region-to-timezone table (NSW->Australia/Sydney, VIC->Australia/Melbourne,
                QLD->Australia/Brisbane). Absent when the region is not one of these.
              type: string
              example: 'Australia/Sydney'
              readOnly: true
            ownerSegment:
              title: Owner segment
              description: >-
                The owner's segment, formatted '<TIER>_<AREA>'. TIER is 'PREMIUM' when
                membershipLevel is 3 or more, otherwise 'STANDARD'. AREA is 'METRO' when the
                locality is a known region (NSW, VIC or QLD), otherwise 'REGIONAL'.
              type: string
              enum:
                - PREMIUM_METRO
                - PREMIUM_REGIONAL
                - STANDARD_METRO
                - STANDARD_REGIONAL
              example: 'STANDARD_METRO'
              readOnly: true
            contactPreference:
              title: Contact preference
              description: >-
                The owner's preferred contact channel: 'EMAIL' when an email address is
                present, otherwise 'PHONE'.
              type: string
              enum:
                - EMAIL
                - PHONE
              example: 'EMAIL'
              readOnly: true
            ageBand:
              title: Age band
              description: >-
                The owner's age band, derived from birthDate against the registrationDate:
                'MINOR' when under 18, 'ADULT' when 18-64, 'SENIOR' when 65 or older. Absent
                when no birthDate was supplied.
              type: string
              enum:
                - MINOR
                - ADULT
                - SENIOR
              example: 'ADULT'
              readOnly: true
            deleted:
              title: Deleted
              description: >-
                'true' when this owner has been soft-deleted via DELETE /api/owners/{id}; the record
                is retained and still readable. A newly created owner is 'false'.
              type: boolean
              example: false
              readOnly: true
            pets:
              title: Pets
              description: The pets owned by this individual including any booked vet visits.
              type: array
              items:
                $ref: '#/components/schemas/Pet'
              readOnly: true
          required:
            - deleted
            - pets
    OwnerPage:
      title: Owner page
      description: A page of pet owners.
      type: object
      properties:
        content:
          title: Content
          description: Pet owners in the requested page.
          type: array
          items:
            $ref: '#/components/schemas/Owner'
        page:
          title: Page
          description: Zero-based page index.
          type: integer
          format: int32
          minimum: 0
          example: 0
        size:
          title: Size
          description: Requested page size.
          type: integer
          format: int32
          minimum: 1
          example: 5
        totalElements:
          title: Total elements
          description: Total number of owners matching the request.
          type: integer
          format: int64
          minimum: 0
          example: 10
        totalPages:
          title: Total pages
          description: Total number of pages matching the request.
          type: integer
          format: int32
          minimum: 0
          example: 2
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
    PetPage:
      title: Pet page
      description: A page of pets.
      type: object
      properties:
        content:
          title: Content
          description: Pets in the requested page.
          type: array
          items:
            $ref: '#/components/schemas/Pet'
        page:
          title: Page
          description: Zero-based page index.
          type: integer
          format: int32
          minimum: 0
          example: 0
        size:
          title: Size
          description: Requested page size.
          type: integer
          format: int32
          minimum: 1
          example: 5
        totalElements:
          title: Total elements
          description: Total number of pets matching the request.
          type: integer
          format: int64
          minimum: 0
          example: 10
        totalPages:
          title: Total pages
          description: Total number of pages matching the request.
          type: integer
          format: int32
          minimum: 0
          example: 2
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
    PetFields:
      title: Pet fields
      description: Editable fields of a pet.
      type: object
      properties:
        name:
          title: Name
          description: The name of the pet.
          type: string
          maxLength: 30
          example: Leo
        birthDate:
          title: Birth date
          description: The date of birth of the pet.
          type: string
          format: date
          example: '2010-09-07'
          x-field-extra-annotation: "@org.springframework.samples.petclinic.rest.validation.PetAgeValidation"
        type:
          $ref: '#/components/schemas/PetType'
      required:
        - name
        - birthDate
        - type
    Pet:
      title: Pet
      description: A pet.
      allOf:
        - $ref: '#/components/schemas/PetFields'
        - type: object
          properties:
            id:
              title: ID
              description: The ID of the pet.
              type: integer
              format: int32
              minimum: 0
              example: 1
              readOnly: true
            ownerId:
              title: Owner ID
              description: The ID of the pet's owner.
              type: integer
              format: int32
              minimum: 0
              example: 1
              readOnly: true
            visits:
              title: Visits
              description: Vet visit bookings for this pet.
              type: array
              items:
                $ref: '#/components/schemas/Visit'
              readOnly: true
          required:
            - id
            - type
            - visits
    VetFields:
      title: VetFields
      description: Editable fields of a veterinarian.
      type: object
      properties:
        firstName:
          title: First name
          description: The first name of the vet.
          type: string
          minLength: 1
          maxLength: 30
          pattern: "^[\\p{L}]+([ '-][\\p{L}]+){0,2}$"
          example: 'James'
        lastName:
          title: Last name
          description: The last name of the vet.
          type: string
          minLength: 1
          maxLength: 30
          pattern: "^[\\p{L}]+([ '-][\\p{L}]+){0,2}\\.?$"
          example: 'Carter'
        specialties:
          title: Specialties
          description: The specialties of the vet.
          type: array
          items:
            $ref: '#/components/schemas/Specialty'
      required:
        - firstName
        - lastName
        - specialties
    Vet:
      title: Vet
      description: A veterinarian.
      allOf:
        - $ref: '#/components/schemas/VetFields'
        - type: object
          properties:
            id:
              title: ID
              description: The ID of the vet.
              type: integer
              format: int32
              minimum: 0
              example: 1
              readOnly: true
      required:
        - id
        - firstName
        - lastName
        - specialties
    VisitFields:
      title: Visit fields
      description: Editable fields of a vet visit.
      type: object
      properties:
        date:
          title: Date
          description: The date of the visit.
          type: string
          format: date
          example: '2013-01-01'
        description:
          title: Description
          description: The description for the visit.
          type: string
          minLength: 1
          maxLength: 255
          example: 'rabies shot'
      required:
        - description
    Visit:
      title: Visit
      description: A booking for a vet visit.
      allOf:
        - $ref: '#/components/schemas/VisitFields'
        - type: object
          properties:
            id:
              title: ID
              description: The ID of the visit.
              type: integer
              format: int32
              minimum: 0
              example: 1
              readOnly: true
            petId:
              title: Pet ID
              description: The ID of the pet.
              type: integer
              format: int32
              minimum: 0
              example: 1
          required:
            - id
            - petId
    PetTypeFields:
      title: PetType fields
      description: Editable fields of a pet type.
      type: object
      properties:
        name:
          title: Name
          description: The name of the pet type.
          type: string
          maxLength: 80
          minLength: 1
          example: cat
      required:
        - name
    PetType:
      title: Pet type
      description: A pet type.
      allOf:
        - $ref: '#/components/schemas/PetTypeFields'
        - type: object
          properties:
            id:
              title: ID
              description: The ID of the pet type.
              type: integer
              format: int32
              minimum: 0
              example: 1
          required:
            - id
    User:
      title: User
      description: An user.
      type: object
      properties:
        username:
          title: username
          description: The username
          type: string
          maxLength: 80
          minLength: 1
          example: john.doe
        password:
          title: Password
          description: The password
          type: string
          maxLength: 80
          minLength: 1
          example: 1234abc
        enabled:
          title: enabled
          description: Indicates if the user is enabled
          type: boolean
          example: true
        roles:
          title: Roles
          description: The roles of an user
          type: array
          items:
            $ref: '#/components/schemas/Role'
      required:
        - username
    Role:
      title: Role
      description: A role.
      type: object
      properties:
        name:
          title: name
          description: The role's name
          type: string
          maxLength: 80
          minLength: 1
          example: admin
      required:
        - name
