components:
  schemas:
    ProblemDetail:
      title: Problem Detail
      description: The schema for all error responses.
      type: object
      properties:
        type:
          title: Type
          description: Full URL that originated the error response.
          type: string
          format: uri
          example: 'http://localhost:9966/petclinic/api/owner'
          readOnly: true
        title:
          title: Title
          description: The short error title.
          type: string
          example: NoResourceFoundException
          readOnly: true
        status:
          title: Status
          description: HTTP status code
          type: integer
          format: int32
          minimum: 400
          maximum: 600
          exclusiveMaximum: true
          example: 500
          readOnly: true
        detail:
          title: Detail
          description: The long error message.
          type: string
          example: 'No static resource api/owner.'
          readOnly: true
        timestamp:
          title: Timestamp
          description: The time the error occurred.
          type: string
          format: date-time
          example: '2024-11-23T13:59:21.3820407Z'
          readOnly: true
        schemaValidationErrors:
          title: Schema validation errors
          description: Validation errors against the OpenAPI schema.
          type: array
          items:
            $ref: '#/components/schemas/ValidationMessage'
      required:
        - type
        - title
        - status
        - detail
        - timestamp
        - schemaValidationErrors
    ValidationMessage:
      title: Validation message
      description: Messages describing a validation error.
      type: object
      properties:
        message:
          title: Message
          description: The validation message.
          type: string
          example: "[Path '/lastName'] Instance type (null) does not match any allowed primitive type (allowed: ['string'])"
          readOnly: true
      required:
        - message
      additionalProperties: true
    Specialty:
      title: Specialty
      description: Fields of specialty of vets.
      type: object
      properties:
        id:
          title: ID
          description: The ID of the specialty.
          type: integer
          format: int32
          minimum: 0
          example: 1
          readOnly: true
        name:
          title: Name
          description: The name of the specialty.
          type: string
          maxLength: 80
          minLength: 1
          example: radiology
      required:
        - id
        - name
    OwnerFields:
      title: Owner fields
      description: Editable fields of a pet owner.
      type: object
      properties:
        title:
          title: Title
          description: >-
            The owner's optional honorific title (one of 'MR', 'MRS', 'MS' or
            'DR'). When supplied it is used to compose the read-only
            'salutation'. Stored and returned when present.
          type: string
          example: DR
        firstName:
          title: First name
          description: The first name of the pet owner.
          type: string
          minLength: 1
          maxLength: 30
          pattern: "^[\\p{L}]+([ '-][\\p{L}]+){0,2}$"
          example: George
        lastName:
          title: Last name
          description: The last name of the pet owner.
          type: string
          minLength: 1
          maxLength: 30
          pattern: "^[\\p{L}]+([ '-][\\p{L}]+){0,2}\\.?$"
          example: Franklin
        address:
          title: Address
          description: >-
            The postal address of the pet owner. Accepted for backward
            compatibility as a flat single-line address. When the structured
            'addressLine1' (with optional 'addressLine2') is supplied it is
            preferred, and this field is returned as the composed value: the
            normalized 'addressLine1' with a single space and the normalized
            'addressLine2' appended when an 'addressLine2' is present.
          type: string
          minLength: 1
          maxLength: 255
          pattern: '.*\S.*'
          example: '110 W. Liberty St.'
        addressLine1:
          title: Address line 1
          description: >-
            The first line of the pet owner's structured postal address.
            Preferred over the flat 'address' when present; normalized the same
            way (trimmed, whitespace-collapsed, upper-cased, common
            abbreviations expanded).
          type: string
          minLength: 1
          maxLength: 255
          pattern: '.*\S.*'
          example: '110 W. Liberty St.'
        addressLine2:
          title: Address line 2
          description: >-
            The optional second line of the pet owner's structured postal
            address (e.g. unit or apartment). Normalized the same way as
            'addressLine1' and, when present, appended to the composed
            'address' after a single space.
          type: string
          minLength: 1
          maxLength: 255
          pattern: '.*\S.*'
          example: 'Apt 2'
        city:
          title: City
          description: The city of the pet owner.
          type: string
          minLength: 1
          maxLength: 80
          pattern: '.*\S.*'
          example: Madison
        telephone:
          title: Telephone number
          description: >-
            The telephone number of the pet owner. On create the value is
            normalized to E.164 form: a leading '+' and country code are kept
            when present, otherwise country code '+61' is assumed and a single
            leading '0' is dropped from the national digits; spaces, dashes and
            brackets are stripped. The result must contain 8 to 15 digits after
            the '+'. Stored and returned in E.164 form (e.g. '+61412345678').
          type: string
          minLength: 1
          maxLength: 20
          example: '+61412345678'
        email:
          title: Email address
          description: >-
            The email address of the pet owner. Optional; when present it must
            be a syntactically valid address and is stored and returned
            lower-cased.
          type: string
          format: email
          maxLength: 255
          example: george.franklin@example.com
        postcode:
          title: Postcode
          description: >-
            The owner's 4-digit postcode. Optional; when present it must be
            valid for the owner's city per the fixed city-to-region table
            (NSW 2000-2099, VIC 3000-3099, QLD 4000-4099). A city with no known
            region accepts any 4-digit postcode. An out-of-range postcode is
            rejected with 400. Stored and returned when supplied.
          type: string
          minLength: 4
          maxLength: 4
          example: '2000'
        registrationDate:
          title: Registration date
          description: >-
            The date the owner was registered. Optional on create; when
            omitted it defaults to the server's current date. Returned in ISO
            'YYYY-MM-DD' format.
          type: string
          format: date
          example: '2020-06-15'
        birthDate:
          title: Birth date
          description: >-
            The owner's date of birth. Optional; when present it is used to
            derive the read-only 'ageBand', the owner's age band computed
            against the registrationDate. Stored and returned in ISO
            'YYYY-MM-DD' format.
          type: string
          format: date
          example: '1990-01-01'
        sharesHousehold:
          title: Shares household
          description: >-
            Write-only flag. Owners with the same lastName and postcode belong to
            the same household (they share a deterministic householdId). When such
            an owner already exists a create request is rejected with 409 Conflict;
            setting this flag true bypasses that block, admitting the owner as a
            declared household member (which is not flagged as a possible duplicate).
          type: boolean
          writeOnly: true
          example: false
      required:
        - firstName
        - lastName
        - city
        - telephone
    Owner:
      title: Owner
      description: A pet owner.
      allOf:
        - $ref: '#/components/schemas/OwnerFields'
        - type: object
          properties:
            id:
              title: ID
              description: The ID of the pet owner.
              type: integer
              format: int32
              minimum: 0
              example: 1
              readOnly: true
            salutation:
              title: Salutation
              description: >-
                The owner's salutation, composed as the title followed by a
                single space and the lastName (e.g. 'DR who') when a title is
                present, or just the lastName when no title was supplied.
              type: string
              example: 'DR Franklin'
              readOnly: true
            displayName:
              title: Display name
              description: The owner's name formatted as 'LastName, FirstName'.
              type: string
              example: 'Franklin, George'
              readOnly: true
            initials:
              title: Initials
              description: >-
                The upper-cased first letters of firstName and lastName,
                dot-separated with a trailing dot.
              type: string
              example: 'G.F.'
              readOnly: true
            selfLink:
              title: Self link
              description: >-
                The canonical API path to this owner, formed as '/api/owners/'
                followed by the owner's id.
              type: string
              example: '/api/owners/1'
              readOnly: true
            telephoneDisplay:
              title: Telephone display
              description: >-
                The stored E.164 telephone number formatted for humans: a
                leading '+' and country code, a space, then the national digits
                grouped in threes (e.g. '+61 412 345 678'). The raw 'telephone'
                stays in E.164 form.
              type: string
              example: '+61 412 345 678'
              readOnly: true
            customerCode:
              title: Customer code
              description: >-
                The owner's customer code, formatted '<REGION>-<HASH8>' where
                REGION is the canonical region derived from the owner's postcode
                (falling back to its city, otherwise 'UNKNOWN') and HASH8 is the
                first eight upper-case hexadecimal characters of the SHA-256
                digest of the owner's normalised telephone concatenated with its
                lastName.
              type: string
              example: 'NSW-9F86D081'
              readOnly: true
            checkDigit:
              title: Check digit
              description: >-
                The single Luhn check digit (0-9) computed over the decimal
                digits contained in the owner's customerCode, processed
                right-to-left with every second digit doubled.
              type: integer
              format: int32
              minimum: 0
              maximum: 9
              example: 7
              readOnly: true
            householdId:
              title: Household ID
              description: >-
                A stable identifier shared by owners in the same household,
                derived deterministically as the first 12 lower-case hexadecimal
                characters of the SHA-256 digest of the owner's normalised
                lastName, a '|' separator and its postcode. Owners with the same
                lastName and postcode therefore resolve to the same householdId.
              type: string
              example: '9e107d9d372b'
              readOnly: true
            namesakeCount:
              title: Namesake count
              description: >-
                The number of existing owners that, at the time this owner was
                created, shared the same firstName and lastName (compared
                case-insensitively). Counts only owners created before this one.
              type: integer
              format: int32
              minimum: 0
              example: 1
              readOnly: true
            fiscalYear:
              title: Fiscal year
              description: >-
                The owner's fiscal year, formatted 'FY<YY>' where YY is the last
                two digits of the fiscal year that contains its
                business-day-adjusted registrationDate. The fiscal year starts on
                1 July and is labelled by the calendar year in which it ends, so a
                registrationDate from July to December falls in the next calendar
                year's fiscal year. Absent when no registrationDate is present.
              type: string
              example: 'FY27'
              readOnly: true
            membershipNumber:
              title: Membership number
              description: >-
                The owner's membership number, formatted '<customerCode>-M<YY>'
                where <customerCode> is the owner's customer code and YY is the
                last two digits of the fiscal year that contains the
                registrationDate (the fiscal year starts on 1 July).
              type: string
              example: 'NSW-9F86D081-M27'
              readOnly: true
            membershipPoints:
              title: Membership points
              description: >-
                The owner's membership points, a non-negative score derived from
                its factors: starting at 0, add 2 when an email is present, add 1
                when namesakeCount is 0, add 2 for a household of 3 or more
                (householdSize) and add 3 when the owner's tenure exceeds a year
                (at least one whole fiscal year elapsed since its registrationDate).
                A newly created owner never earns the tenure points.
              type: integer
              format: int32
              minimum: 0
              example: 3
              readOnly: true
            membershipLevel:
              title: Membership level
              description: >-
                The owner's membership level, a number from 1 to 4, mapped from its
                membershipPoints: level 1 for 0-1 points, level 2 for 2-3, level 3
                for 4-5 and level 4 for 6 or more.
              type: integer
              format: int32
              minimum: 1
              maximum: 4
              example: 2
              readOnly: true
            locality:
              title: Locality
              description: >-
                The owner's canonical region, read from the '<REGION>' component
                of its region-and-hash customerCode (the region derived from the
                owner's postcode, falling back to its city, otherwise 'UNKNOWN').
              type: string
              example: 'NSW'
              readOnly: true
            timezone:
              title: Timezone
              description: >-
                The owner's IANA timezone name, derived from its locality/region
                via the fixed region-to-timezone table (NSW->Australia/Sydney,
                VIC->Australia/Melbourne, QLD->Australia/Brisbane). Absent when
                the region is not in the table.
              type: string
              example: 'Australia/Sydney'
              readOnly: true
            contactPreference:
              title: Contact preference
              description: >-
                The owner's preferred contact channel: 'EMAIL' when an email
                address is present, otherwise 'PHONE'.
              type: string
              example: 'EMAIL'
              readOnly: true
            ageBand:
              title: Age band
              description: >-
                The owner's age band, derived from birthDate when present:
                'MINOR' when under 18, 'ADULT' from 18 to 64, and 'SENIOR' at
                65 or over, with age computed against the registrationDate.
                Absent when no birthDate was supplied.
              type: string
              example: 'ADULT'
              readOnly: true
            bulkSignupWarning:
              title: Bulk signup warning
              description: >-
                Whether, at the time this owner was created, more than 80 owners
                had already been created for the same registration date; 'true'
                once that threshold is exceeded, otherwise 'false'.
              type: boolean
              example: false
              readOnly: true
            identityKey:
              title: Identity key
              description: >-
                A derived key combining the owner's normalised telephone, email
                and householdId, formed as
                'normalizedTelephone|<email or empty>|<householdId or empty>'.
                Because owners with the same lastName and postcode share a
                householdId, duplicate detection is keyed on the household: a
                second owner in an existing household is rejected with 409 Conflict
                unless it sets 'sharesHousehold'.
              type: string
              example: '+61412345678||'
              readOnly: true
            possibleDuplicate:
              title: Possible duplicate
              description: >-
                Whether, at the time this owner was created, it was a soft match
                for an existing owner: sharing that owner's lastName and postcode
                with a different telephone. 'true' when such a match exists,
                otherwise 'false'. A declared household member (admitted via
                'sharesHousehold') is never flagged: it is not a suspected duplicate.
              type: boolean
              example: false
              readOnly: true
            possibleDuplicateOf:
              title: Possible duplicate of
              description: >-
                The id of the existing owner this owner soft-matched at creation
                (same lastName and postcode, different telephone), or absent when
                'possibleDuplicate' is false.
              type: integer
              format: int32
              minimum: 0
              example: 1
              readOnly: true
            deleted:
              title: Deleted
              description: >-
                Whether this owner has been soft-deleted. A newly created owner is
                'false'; deleting the owner via DELETE /api/owners/{id} sets it to
                'true' while retaining the record. Owners flagged deleted are ignored
                by the create endpoint's duplicate and identity checks.
              type: boolean
              example: false
              readOnly: true
            pets:
              title: Pets
              description: The pets owned by this individual including any booked vet visits.
              type: array
              items:
                $ref: '#/components/schemas/Pet'
              readOnly: true
          required:
            - pets
    OwnerPage:
      title: Owner page
      description: A page of pet owners.
      type: object
      properties:
        content:
          title: Content
          description: Pet owners in the requested page.
          type: array
          items:
            $ref: '#/components/schemas/Owner'
        page:
          title: Page
          description: Zero-based page index.
          type: integer
          format: int32
          minimum: 0
          example: 0
        size:
          title: Size
          description: Requested page size.
          type: integer
          format: int32
          minimum: 1
          example: 5
        totalElements:
          title: Total elements
          description: Total number of owners matching the request.
          type: integer
          format: int64
          minimum: 0
          example: 10
        totalPages:
          title: Total pages
          description: Total number of pages matching the request.
          type: integer
          format: int32
          minimum: 0
          example: 2
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
    PetPage:
      title: Pet page
      description: A page of pets.
      type: object
      properties:
        content:
          title: Content
          description: Pets in the requested page.
          type: array
          items:
            $ref: '#/components/schemas/Pet'
        page:
          title: Page
          description: Zero-based page index.
          type: integer
          format: int32
          minimum: 0
          example: 0
        size:
          title: Size
          description: Requested page size.
          type: integer
          format: int32
          minimum: 1
          example: 5
        totalElements:
          title: Total elements
          description: Total number of pets matching the request.
          type: integer
          format: int64
          minimum: 0
          example: 10
        totalPages:
          title: Total pages
          description: Total number of pages matching the request.
          type: integer
          format: int32
          minimum: 0
          example: 2
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
    PetFields:
      title: Pet fields
      description: Editable fields of a pet.
      type: object
      properties:
        name:
          title: Name
          description: The name of the pet.
          type: string
          maxLength: 30
          example: Leo
        birthDate:
          title: Birth date
          description: The date of birth of the pet.
          type: string
          format: date
          example: '2010-09-07'
          x-field-extra-annotation: "@org.springframework.samples.petclinic.rest.validation.PetAgeValidation"
        type:
          $ref: '#/components/schemas/PetType'
      required:
        - name
        - birthDate
        - type
    Pet:
      title: Pet
      description: A pet.
      allOf:
        - $ref: '#/components/schemas/PetFields'
        - type: object
          properties:
            id:
              title: ID
              description: The ID of the pet.
              type: integer
              format: int32
              minimum: 0
              example: 1
              readOnly: true
            ownerId:
              title: Owner ID
              description: The ID of the pet's owner.
              type: integer
              format: int32
              minimum: 0
              example: 1
              readOnly: true
            visits:
              title: Visits
              description: Vet visit bookings for this pet.
              type: array
              items:
                $ref: '#/components/schemas/Visit'
              readOnly: true
          required:
            - id
            - type
            - visits
    VetFields:
      title: VetFields
      description: Editable fields of a veterinarian.
      type: object
      properties:
        firstName:
          title: First name
          description: The first name of the vet.
          type: string
          minLength: 1
          maxLength: 30
          pattern: "^[\\p{L}]+([ '-][\\p{L}]+){0,2}$"
          example: 'James'
        lastName:
          title: Last name
          description: The last name of the vet.
          type: string
          minLength: 1
          maxLength: 30
          pattern: "^[\\p{L}]+([ '-][\\p{L}]+){0,2}\\.?$"
          example: 'Carter'
        specialties:
          title: Specialties
          description: The specialties of the vet.
          type: array
          items:
            $ref: '#/components/schemas/Specialty'
      required:
        - firstName
        - lastName
        - specialties
    Vet:
      title: Vet
      description: A veterinarian.
      allOf:
        - $ref: '#/components/schemas/VetFields'
        - type: object
          properties:
            id:
              title: ID
              description: The ID of the vet.
              type: integer
              format: int32
              minimum: 0
              example: 1
              readOnly: true
      required:
        - id
        - firstName
        - lastName
        - specialties
    VisitFields:
      title: Visit fields
      description: Editable fields of a vet visit.
      type: object
      properties:
        date:
          title: Date
          description: The date of the visit.
          type: string
          format: date
          example: '2013-01-01'
        description:
          title: Description
          description: The description for the visit.
          type: string
          minLength: 1
          maxLength: 255
          example: 'rabies shot'
      required:
        - description
    Visit:
      title: Visit
      description: A booking for a vet visit.
      allOf:
        - $ref: '#/components/schemas/VisitFields'
        - type: object
          properties:
            id:
              title: ID
              description: The ID of the visit.
              type: integer
              format: int32
              minimum: 0
              example: 1
              readOnly: true
            petId:
              title: Pet ID
              description: The ID of the pet.
              type: integer
              format: int32
              minimum: 0
              example: 1
          required:
            - id
            - petId
    PetTypeFields:
      title: PetType fields
      description: Editable fields of a pet type.
      type: object
      properties:
        name:
          title: Name
          description: The name of the pet type.
          type: string
          maxLength: 80
          minLength: 1
          example: cat
      required:
        - name
    PetType:
      title: Pet type
      description: A pet type.
      allOf:
        - $ref: '#/components/schemas/PetTypeFields'
        - type: object
          properties:
            id:
              title: ID
              description: The ID of the pet type.
              type: integer
              format: int32
              minimum: 0
              example: 1
          required:
            - id
    User:
      title: User
      description: An user.
      type: object
      properties:
        username:
          title: username
          description: The username
          type: string
          maxLength: 80
          minLength: 1
          example: john.doe
        password:
          title: Password
          description: The password
          type: string
          maxLength: 80
          minLength: 1
          example: 1234abc
        enabled:
          title: enabled
          description: Indicates if the user is enabled
          type: boolean
          example: true
        roles:
          title: Roles
          description: The roles of an user
          type: array
          items:
            $ref: '#/components/schemas/Role'
      required:
        - username
    Role:
      title: Role
      description: A role.
      type: object
      properties:
        name:
          title: name
          description: The role's name
          type: string
          maxLength: 80
          minLength: 1
          example: admin
      required:
        - name
